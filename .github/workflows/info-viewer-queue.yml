name: Info Viewer Pipeline

on:
  schedule:
    - cron: "0,30 * * * *"
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      video_url:
        description: "今すぐ処理する YouTube 動画URL"
        required: true
        type: string
  repository_dispatch:
    types: [trigger-from-appsheet-info-viewer, trigger-from-appsheet]

jobs:
  build-info-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.13 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依存パッケージをインストール
        run: pip install -r scripts/pipeline/requirements.txt

      - name: OneDrive refresh token をVercelから同期
        env:
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          VERCEL_URL: https://blog-vercel-dun.vercel.app
        run: python scripts/pipeline/sync_onedrive_refresh_token_from_vercel.py

      - name: info_viewer パイプラインを実行
        id: info_viewer
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          GEMINI_TOKEN_invest: ${{ secrets.GEMINI_TOKEN_INVEST }}
          GEMINI_TOKEN_INVESTsub: ${{ secrets.GEMINI_TOKEN_INVESTSUB }}
          GEMINI_TOKEN_tech: ${{ secrets.GEMINI_TOKEN_TECH }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          INFO_VIEWER_CHANNEL_SHEET_NAME: チャンネル設定
          INFO_VIEWER_VIDEO_SHEET_NAME: 動画リスト
          INFO_VIEWER_ONEDRIVE_FOLDER: Obsidian in Onedrive 202602/Vercel_Blog/info_viewer
          INFO_VIEWER_REQUIRE_NOTION_SAVE: "false"
          INFO_VIEWER_GEMINI_SERIAL_DELAY_SECONDS: "20"
          INFO_VIEWER_RETRY_SECONDS: "3600"
          INFO_VIEWER_QUOTA_RETRY_SECONDS: "7200"
          INPUT_MODE: process_queue
          INPUT_MAX_ITEMS: ${{ github.event_name == 'workflow_dispatch' && '1' || '2' }}
          INPUT_CHANNEL_NAME: ""
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url || '' }}
          INPUT_REBUILD_MANIFEST_ONLY: "false"
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          MODE="${INPUT_MODE}"
          MAX_ITEMS="${INPUT_MAX_ITEMS}"

          if [ "${EVENT_NAME}" = "schedule" ]; then
            if [ "${EVENT_SCHEDULE}" = "0,30 * * * *" ]; then
              MODE="sync_only"
              MAX_ITEMS="0"
            elif [ "${EVENT_SCHEDULE}" = "15 * * * *" ]; then
              MODE="process_queue"
              MAX_ITEMS="${INPUT_MAX_ITEMS}"
            fi
          fi

          if [ "${MODE}" = "notion_backfill" ]; then
            CMD=(python scripts/info_viewer/notion_backfill.py
              --limit "${MAX_ITEMS}"
              --video-url "${INPUT_VIDEO_URL}"
            )
          else
            CMD=(python scripts/info_viewer/main.py
              --max-items "${MAX_ITEMS}"
              --channel-name "${INPUT_CHANNEL_NAME}"
              --video-url "${INPUT_VIDEO_URL}"
            )

            if [ "${MODE}" = "sync_only" ]; then
              CMD+=("--sync-only")
            elif [ "${MODE}" = "process_queue" ]; then
              CMD+=("--process-queue")
            fi

            if [ "${INPUT_REBUILD_MANIFEST_ONLY}" = "true" ] || [ "${MODE}" = "rebuild_manifest_only" ]; then
              CMD+=("--rebuild-manifest-only")
            fi
          fi

          "${CMD[@]}"

      - name: Discord Notification
        if: always() && steps.info_viewer.outputs.notion_urls != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not set, skipping Discord notification."
            exit 0
          fi
          
          IFS=',' read -ra ITEMS <<< "${{ steps.info_viewer.outputs.notion_urls }}"
          for ITEM in "${ITEMS[@]}"; do
            CHANNEL="${ITEM%%|*}"
            REST="${ITEM#*|}"
            TITLE="${REST%%|*}"
            URL="${REST##*|}"
            MESSAGE="【Notion記事更新】\n${CHANNEL}\n${TITLE}\n${URL}"
            curl -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK"
          done
