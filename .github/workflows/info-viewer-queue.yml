name: Info Viewer Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "今すぐ処理する YouTube 動画URL"
        required: true
        type: string
  repository_dispatch:
    types: [trigger-from-appsheet-info-viewer, trigger-from-appsheet]

concurrency:
  group: info-viewer-pipeline
  cancel-in-progress: false

jobs:
  build-info-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          ref: main

      - name: Python 3.13 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依存パッケージをインストール
        run: pip install -r scripts/pipeline/requirements.txt

      - name: OneDrive refresh token をVercelから同期
        env:
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          VERCEL_URL: https://blog-vercel-dun.vercel.app
        run: python scripts/pipeline/sync_onedrive_refresh_token_from_vercel.py

      - name: 手動URLを単発処理
        if: github.event_name == 'workflow_dispatch'
        id: manual_info_viewer
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          GEMINI_TOKEN_invest: ${{ secrets.GEMINI_TOKEN_INVEST }}
          GEMINI_TOKEN_INVESTsub: ${{ secrets.GEMINI_TOKEN_INVESTSUB }}
          GEMINI_TOKEN_tech: ${{ secrets.GEMINI_TOKEN_TECH }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          INFO_VIEWER_ONEDRIVE_FOLDER: Obsidian in Onedrive 202602/Vercel_Blog/info_viewer
          INFO_VIEWER_REQUIRE_NOTION_SAVE: "true"
          INFO_VIEWER_RETRY_SECONDS: "3600"
          INFO_VIEWER_QUOTA_RETRY_SECONDS: "7200"
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: python scripts/info_viewer/manual_url.py --video-url "${INPUT_VIDEO_URL}"

      - name: info_viewer パイプラインを実行
        if: github.event_name != 'workflow_dispatch'
        id: info_viewer
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          GEMINI_TOKEN_invest: ${{ secrets.GEMINI_TOKEN_INVEST }}
          GEMINI_TOKEN_INVESTsub: ${{ secrets.GEMINI_TOKEN_INVESTSUB }}
          GEMINI_TOKEN_tech: ${{ secrets.GEMINI_TOKEN_TECH }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          INFO_VIEWER_CHANNEL_SHEET_NAME: チャンネル設定
          INFO_VIEWER_VIDEO_SHEET_NAME: 動画リスト
          INFO_VIEWER_ONEDRIVE_FOLDER: Obsidian in Onedrive 202602/Vercel_Blog/info_viewer
          INFO_VIEWER_REQUIRE_NOTION_SAVE: "true"
          INFO_VIEWER_GEMINI_SERIAL_DELAY_SECONDS: "20"
          INFO_VIEWER_RETRY_SECONDS: "3600"
          INFO_VIEWER_QUOTA_RETRY_SECONDS: "7200"
          INFO_VIEWER_PROCESS_AFTER: "2026-10-14T16:35:35Z"
          INPUT_MODE: process_queue
          INPUT_MAX_ITEMS: "4"
          INPUT_CHANNEL_NAME: ""
          INPUT_VIDEO_URL: ${{ github.event.client_payload.video_url || '' }}
          INPUT_REBUILD_MANIFEST_ONLY: "false"
        run: |
          MODE="${INPUT_MODE}"
          MAX_ITEMS="${INPUT_MAX_ITEMS}"

          if [ "${MODE}" = "notion_backfill" ]; then
            CMD=(python scripts/info_viewer/notion_backfill.py
              --limit "${MAX_ITEMS}"
              --video-url "${INPUT_VIDEO_URL}"
            )
          else
            CMD=(python scripts/info_viewer/main.py
              --max-items "${MAX_ITEMS}"
              --channel-name "${INPUT_CHANNEL_NAME}"
              --video-url "${INPUT_VIDEO_URL}"
            )

            if [ "${MODE}" = "sync_only" ]; then
              CMD+=("--sync-only")
            elif [ "${MODE}" = "process_queue" ]; then
              CMD+=("--process-queue")
            fi

            if [ "${INPUT_REBUILD_MANIFEST_ONLY}" = "true" ] || [ "${MODE}" = "rebuild_manifest_only" ]; then
              CMD+=("--rebuild-manifest-only")
            fi
          fi

          "${CMD[@]}"

      - name: Cloudflare Pages用の静的Viewerを書き出し
        if: success() && (github.event_name == 'workflow_dispatch' || steps.info_viewer.outputs.success_count != '0')
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          INFO_VIEWER_ONEDRIVE_FOLDER: Obsidian in Onedrive 202602/Vercel_Blog/info_viewer
        run: python scripts/info_viewer/export_static_site.py

      - name: 静的Viewerの更新をGitHubへ反映
        if: success() && (github.event_name == 'workflow_dispatch' || steps.info_viewer.outputs.success_count != '0')
        id: publish_static_viewer
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          INFO_VIEWER_ONEDRIVE_FOLDER: Obsidian in Onedrive 202602/Vercel_Blog/info_viewer
        run: |
          git config user.name "info-viewer-bot"
          git config user.email "info-viewer-bot@users.noreply.github.com"
          git add -- info_viewer_site/content/articles info_viewer_site/data/article_index.json info_viewer_site/static/search.json
          if git diff --cached --quiet; then
            echo "静的Viewerに反映すべき差分はありません。"
            exit 0
          fi
          git commit -m "chore: info viewer static content"
          for ATTEMPT in 1 2 3 4 5; do
            echo "mainへの反映を試行します: ${ATTEMPT}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "最新mainと競合したため、最新状態から静的Viewerを再生成します。"
              git reset --hard origin/main
              python scripts/info_viewer/export_static_site.py
              git add -- info_viewer_site/content/articles info_viewer_site/data/article_index.json info_viewer_site/static/search.json
              if git diff --cached --quiet; then
                echo "最新mainに同じ内容が反映済みです。"
                exit 0
              fi
              git commit -m "chore: info viewer static content"
              continue
            fi
            if git push origin HEAD:main; then
              echo "静的Viewerをmainへ反映しました。"
              exit 0
            fi
            if [ "${ATTEMPT}" -lt 5 ]; then
              WAIT_SECONDS=$((ATTEMPT * 10))
              echo "別処理がmainを更新したため、${WAIT_SECONDS}秒後に再試行します。"
              sleep "${WAIT_SECONDS}"
            fi
          done
          echo "::error::5回試行しても静的Viewerをmainへ反映できませんでした。"
          exit 1

      - name: Discord Notification (手動URL)
        if: always() && steps.manual_info_viewer.outputs.notion_urls != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not set, skipping Discord notification."
            exit 0
          fi

          IFS=',' read -ra ITEMS <<< "${{ steps.manual_info_viewer.outputs.notion_urls }}"
          for ITEM in "${ITEMS[@]}"; do
            IFS='|' read -r CHANNEL TITLE NOTION_URL VIEWER_URL <<< "$ITEM"
            MESSAGE="【記事更新】\n${CHANNEL}\n${TITLE}\nNotion\n${NOTION_URL}\nInfo Viewer\n${VIEWER_URL}"
            curl -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK"
          done

      - name: Discord Notification
        if: always() && steps.info_viewer.outputs.notion_urls != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not set, skipping Discord notification."
            exit 0
          fi
          
          IFS=',' read -ra ITEMS <<< "${{ steps.info_viewer.outputs.notion_urls }}"
          for ITEM in "${ITEMS[@]}"; do
            IFS='|' read -r CHANNEL TITLE NOTION_URL VIEWER_URL <<< "$ITEM"
            MESSAGE="【記事更新】\n${CHANNEL}\n${TITLE}\nNotion\n${NOTION_URL}\nInfo Viewer\n${VIEWER_URL}"
            curl -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK"
          done

      - name: Info Viewer実行結果を確認
        if: always() && github.event_name != 'workflow_dispatch'
        env:
          SUCCESS_COUNT: ${{ steps.info_viewer.outputs.success_count }}
          FAILURE_COUNT: ${{ steps.info_viewer.outputs.failure_count }}
          APIFY_AUTH_ERROR: ${{ steps.info_viewer.outputs.apify_auth_error }}
        run: |
          {
            echo "## Info Viewer 実行結果"
            echo "- 成功: ${SUCCESS_COUNT:-0}件"
            echo "- 失敗: ${FAILURE_COUNT:-0}件"
            echo "- Apify認証・権限エラー: ${APIFY_AUTH_ERROR:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${APIFY_AUTH_ERROR}" = "true" ]; then
            echo "::error::ApifyがHTTP 401または403を返しました。APIFY_API_KEYの権限を確認してください。静的Viewerの書き出しとGitHub反映は先に実行済みです。"
            exit 1
          fi
