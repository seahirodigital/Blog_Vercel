    - cron: '55 20 21 11 *'
    - cron: '55 1 22 11 *'
    - cron: '55 6 22 11 *'
    - cron: '55 11 22 11 *'
    - cron: '55 20 22 11 *'
    - cron: '55 1 23 11 *'
    - cron: '55 6 23 11 *'
    - cron: '55 11 23 11 *'
    - cron: '55 20 23 11 *'
    - cron: '55 1 24 11 *'
    - cron: '55 6 24 11 *'
    - cron: '55 13 25 11 *'
    - cron: '55 20 25 11 *'
    - cron: '55 1 26 11 *'
    - cron: '55 6 26 11 *'
    - cron: '55 11 26 11 *'
    - cron: '55 20 26 11 *'
    - cron: '55 1 27 11 *'
    - cron: '55 6 27 11 *'
    - cron: '55 11 27 11 *'
    - cron: '55 20 27 11 *'
    - cron: '55 1 28 11 *'
    - cron: '55 6 28 11 *'
