name: Note 公開投稿 予約監視セッション

# このファイルは予約一覧から自動生成します。
# 1回起動した監視ジョブが、セッション中に定期確認して対象予約を起動します。

on:
  workflow_dispatch:
  schedule:
    - cron: '55 7 15 10 *'
    - cron: '55 12 15 10 *'
    - cron: '25 18 15 10 *'
    - cron: '25 23 15 10 *'
    - cron: '25 4 16 10 *'
    - cron: '25 9 16 10 *'
    - cron: '25 14 16 10 *'
    - cron: '25 19 16 10 *'
    - cron: '25 0 17 10 *'
    - cron: '25 5 17 10 *'
    - cron: '25 10 17 10 *'
    - cron: '25 15 17 10 *'
    - cron: '25 20 17 10 *'
    - cron: '25 1 18 10 *'
    - cron: '25 6 18 10 *'
    - cron: '25 11 18 10 *'
    - cron: '25 16 18 10 *'
    - cron: '25 21 18 10 *'
    - cron: '25 2 19 10 *'
    - cron: '25 7 19 10 *'
    - cron: '25 12 19 10 *'
    - cron: '25 17 19 10 *'
    - cron: '25 22 19 10 *'
    - cron: '25 3 20 10 *'

jobs:
  dispatch-reserved-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: note-post-reservation-dispatch
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 予約時刻が近い投稿ジョブを監視して起動
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTE_POST_SCHEDULE_SOURCE: github-reservation-monitor
          NOTE_POST_QUEUE_STALE_MINUTES: "90"
          NOTE_POST_PRESTART_WINDOW_MINUTES: "35"
          NOTE_POST_LATE_GRACE_MINUTES: "720"
          NOTE_POST_MONITOR_MODE: "true"
          NOTE_POST_MONITOR_DURATION_MINUTES: "330"
          NOTE_POST_MONITOR_POLL_SECONDS: "60"
        run: python .github/scripts/note_post_schedule_dispatch.py
