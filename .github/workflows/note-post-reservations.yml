    - cron: '55 11 5 10 *'
    - cron: '55 19 5 10 *'
    - cron: '55 1 6 10 *'
    - cron: '55 6 6 10 *'
    - cron: '55 11 6 10 *'
    - cron: '55 19 6 10 *'
    - cron: '55 1 7 10 *'
    - cron: '55 6 7 10 *'
    - cron: '55 11 7 10 *'
    - cron: '55 19 7 10 *'
    - cron: '55 1 8 10 *'
    - cron: '55 6 8 10 *'
    - cron: '55 11 8 10 *'
    - cron: '55 19 8 10 *'
    - cron: '55 1 9 10 *'
