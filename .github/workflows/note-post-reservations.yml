    - cron: '55 6 11 10 *'
    - cron: '55 11 11 10 *'
    - cron: '55 19 11 10 *'
    - cron: '55 1 12 10 *'
    - cron: '55 6 12 10 *'
    - cron: '55 11 12 10 *'
    - cron: '55 19 12 10 *'
    - cron: '55 1 13 10 *'
    - cron: '55 6 13 10 *'
    - cron: '55 11 13 10 *'
    - cron: '55 19 13 10 *'
    - cron: '55 1 14 10 *'
    - cron: '55 6 14 10 *'
    - cron: '55 11 14 10 *'
