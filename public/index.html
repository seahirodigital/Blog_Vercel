<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Blog Engine</title>
  <meta name="description" content="YouTube動画からAIで自動生成されたブログ記事を閲覧・編集・保存できるMarkdownエディタ" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (JSX transpilation) -->
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
  <!-- Marked.js (Markdown → HTML) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      background: #f8fafc;
      color: #334155;
    }

    /* ── アニメーション ── */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .5
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0
      }

      100% {
        background-position: 200% 0
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.35s ease-out;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease-out;
    }

    .animate-spin {
      animation: spin 0.8s linear infinite;
    }

    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 0.5rem;
    }

    /* ── スクロールバー ── */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* ── リサイズハンドル ── */
    .resize-handle {
      width: 5px;
      background: transparent;
      cursor: col-resize;
      flex-shrink: 0;
      position: relative;
      transition: background 0.15s;
      z-index: 10;
    }

    .resize-handle:hover,
    .resize-handle.dragging {
      background: #7C4DFF;
    }

    .resize-handle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 3px;
      height: 40px;
      border-radius: 9999px;
      background: #cbd5e1;
      transition: background 0.15s;
    }

    .resize-handle:hover::after,
    .resize-handle.dragging::after {
      background: #7C4DFF;
    }

    /* サイドバー境界ハンドル */
    .sidebar-resize-handle {
      width: 4px;
      background: transparent;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      z-index: 10;
    }

    .sidebar-resize-handle:hover,
    .sidebar-resize-handle.dragging {
      background: #7C4DFF22;
    }

    /* ── エディタ ── */
    .editor-textarea {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      line-height: 1.75;
      resize: none;
      tab-size: 2;
    }

    /* ── Markdown プレビュー ── */
    .markdown-preview h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e293b;
      margin: 1.5rem 0 0.75rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
    }

    .markdown-preview h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin: 1.25rem 0 0.5rem;
    }

    .markdown-preview h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
      margin: 1rem 0 0.4rem;
    }

    .markdown-preview p {
      margin: 0.7rem 0;
      line-height: 1.85;
    }

    .markdown-preview ul {
      margin: 0.7rem 0;
      padding-left: 0;
      list-style-type: none;
    }

    .markdown-preview ol {
      margin: 0.7rem 0;
      padding-left: 1.5rem;
    }

    .markdown-preview ul>li {
      margin: 0.35rem 0;
      line-height: 1.7;
      padding-left: 1.2rem;
      position: relative;
    }

    .markdown-preview ul>li::before {
      content: '・';
      position: absolute;
      left: 0;
      color: #475569;
    }

    .markdown-preview ol li {
      margin: 0.35rem 0;
      line-height: 1.7;
    }

    .markdown-preview blockquote {
      border-left: 4px solid #7C4DFF;
      background: #f5f3ff;
      padding: 0.75rem 1rem;
      margin: 0.75rem 0;
      border-radius: 0 0.5rem 0.5rem 0;
      color: #4c1d95;
    }

    .markdown-preview code {
      background: #f1f5f9;
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #7C4DFF;
    }

    .markdown-preview pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 0.75rem;
      overflow-x: auto;
      margin: 1rem 0;
    }

    .markdown-preview pre code {
      background: none;
      color: inherit;
      padding: 0;
    }

    .markdown-preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }

    .markdown-preview th {
      background: #f8fafc;
      font-weight: 600;
      text-align: left;
      padding: 0.65rem 0.75rem;
      border: 1px solid #e2e8f0;
    }

    .markdown-preview td {
      padding: 0.65rem 0.75rem;
      border: 1px solid #e2e8f0;
    }

    .markdown-preview a {
      color: #7C4DFF;
      text-decoration: underline;
    }

    .markdown-preview img {
      max-width: 100%;
      border-radius: 0.5rem;
      margin: 0.5rem 0;
    }

    .markdown-preview hr {
      border: none;
      border-top: 2px solid #e2e8f0;
      margin: 1.5rem 0;
    }

    /* ── トースト ── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.875rem 1.25rem;
      border-radius: 0.75rem;
      color: white;
      font-weight: 600;
      z-index: 9999;
      animation: fadeInUp 0.3s ease-out;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toast-success {
      background: linear-gradient(135deg, #10B981, #059669);
    }

    .toast-error {
      background: linear-gradient(135deg, #F43F5E, #E11D48);
    }

    .toast-info {
      background: linear-gradient(135deg, #7C4DFF, #651FFF);
    }

    /* ── サイドバー ── */
    .sidebar-collapsed {
      width: 0 !important;
      overflow: hidden;
    }

    /* ── フォルダツリー ── */
    .folder-item {
      transition: background 0.15s;
    }

    .folder-item:hover {
      background: #f8fafc;
    }

    .article-item {
      transition: all 0.15s;
    }

    .article-item:hover {
      background: #f1f5f9;
    }

    .article-item.active {
      background: #7C4DFF;
      color: white;
    }

    .article-item.active .article-date {
      color: #c4b5fd;
    }

    /* タイトル編集インプット */
    .title-input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
      width: 100%;
    }

    .title-input:focus {
      background: #f8fafc;
      border-radius: 0.25rem;
      padding: 0 0.25rem;
    }

    /* タブ（モバイル） */
    .tab-active {
      border-bottom: 3px solid #7C4DFF;
      color: #7C4DFF;
      font-weight: 600;
    }

    /* サイドバートグルボタン */
    .sidebar-toggle {
      position: absolute;
      top: 50%;
      right: -14px;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: white;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.15s;
    }

    .sidebar-toggle:hover {
      background: #7C4DFF;
      border-color: #7C4DFF;
      color: white;
    }

    .sidebar-toggle svg {
      transition: transform 0.2s;
    }

    /* ── モバイルドロワー ── */
    .mobile-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      z-index: 50;
      background: white;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }

    .mobile-drawer.open {
      transform: translateX(0);
    }

    .mobile-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 40;
    }

    /* ── アフィリンクモーダル ── */
    .aff-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease-out;
    }

    .aff-modal {
      background: white;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.25s ease-out;
      overflow: hidden;
      min-width: 400px;
      min-height: 300px;
    }

    .aff-tab {
      padding: 0.625rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .aff-tab:hover {
      color: #7C4DFF;
    }

    .aff-tab.active {
      color: #7C4DFF;
      border-bottom-color: #7C4DFF;
    }

    .aff-tab-add {
      width: 40px;
      min-width: 40px;
      height: 40px;
      border: none;
      border-left: 1px solid #e2e8f0;
      background: white;
      color: #7C4DFF;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1;
    }

    .aff-tab-add:hover {
      background: #f5f3ff;
    }

    .aff-tab-context-menu {
      position: fixed;
      z-index: 120;
      min-width: 132px;
      padding: 0.3rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.625rem;
      background: white;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
    }

    .aff-tab-context-menu button {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: none;
      border-radius: 0.4rem;
      background: transparent;
      color: #334155;
      cursor: pointer;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .aff-tab-context-menu button:hover {
      background: #f5f3ff;
      color: #7C4DFF;
    }

    .aff-tab-context-menu button.danger {
      color: #ef4444;
    }

    .aff-tab-context-menu button.danger:hover {
      background: #fef2f2;
    }

    .aff-ta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.7;
      resize: none;
      flex: 1;
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      background: #f8fafc;
      color: #334155;
      outline: none;
      transition: border-color 0.15s;
    }

    .aff-ta:focus {
      border-color: #7C4DFF;
      box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.1);
    }

    /* モーダルリサイズハンドル */
    .aff-resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 22px;
      height: 22px;
      cursor: se-resize;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 4px;
      color: #cbd5e1;
      z-index: 10;
    }

    .aff-resize-handle:hover {
      color: #7C4DFF;
    }

    /* OGPカード（Amazon風：テキスト左・画像右） */
    .ogp-card {
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      text-decoration: none !important;
      color: inherit !important;
      margin: 0.75rem 0;
      background: #fff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
      transition: box-shadow 0.15s;
      min-height: 100px;
      max-height: 160px;
    }

    .ogp-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
    }

    .ogp-card-body {
      padding: 0.875rem 1rem;
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      min-width: 0;
    }

    .ogp-card-domain {
      font-size: 0.68rem;
      color: #94a3b8;
    }

    .ogp-card-title {
      font-weight: 700;
      font-size: 0.88rem;
      line-height: 1.4;
      color: #1e293b;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .ogp-card-desc {
      font-size: 0.72rem;
      color: #64748b;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-top: auto;
    }

    .ogp-card-image {
      width: 140px;
      min-width: 140px;
      max-width: 140px;
      object-fit: contain;
      padding: 0.5rem;
      background: #f8fafc;
      flex-shrink: 0;
    }

    /* ── モバイルスワイプアクション（タッチデバイス専用） ── */
    .swipe-row {
      position: relative;
      overflow: hidden;
      border-radius: 0.375rem;
    }

    /* swipe-inner は常に幅100%でrevealボタンを隠す */
    .swipe-inner {
      transition: transform 0.2s ease;
      will-change: transform;
      width: 100%;
    }

    .swipe-inner.swiped {
      transform: translateX(-84px);
    }

    /* デスクトップ（ホバー可能デバイス）ではスワイプボタン完全非表示 */
    @media (hover: hover) and (pointer: fine) {
      .swipe-actions-reveal {
        display: none !important;
      }
    }

    /* スワイプされていない状態では非表示、swiped-activeクラスがついた場合のみ表示 */
    .swipe-actions-reveal {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      display: none;
      width: 84px;
      overflow: hidden;
      border-radius: 0 0.375rem 0.375rem 0;
    }

    .swipe-row.swiped-active .swipe-actions-reveal {
      display: flex;
    }

    .swipe-action-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      gap: 3px;
      padding: 0;
      transition: opacity 0.1s;
    }

    .swipe-action-btn:active {
      opacity: 0.75;
    }

    /* ── 長押しドラッグ（タッチ） ── */
    .touch-drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      background: white;
      border-radius: 8px;
      padding: 7px 14px;
      box-shadow: 0 8px 28px rgba(124, 77, 255, 0.35);
      border: 2px solid #7C4DFF;
      font-size: 12px;
      font-weight: 600;
      color: #7C4DFF;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translate(-50%, calc(-100% - 14px));
    }

    .touch-dragging-item {
      opacity: 0.35;
    }

    .touch-drag-folder-target {
      background: rgba(124, 77, 255, 0.12) !important;
      outline: 2px dashed #7C4DFF !important;
      outline-offset: -2px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    /** @jsxRuntime classic */
    const { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo } = React;

    // Marked.js: リンクを別タブで開く（v5 API：オブジェクト引数）
    marked.use({
      // 表示時だけ通常改行を改行として描画する。
      // OneDriveやnoteへ保存するMarkdown本文に<br>は追加しない。
      breaks: true,
      renderer: {
        link({ href, title, text }) {
          const safeHref = href || '';
          const safeText = text || safeHref;
          return `<a href="${safeHref}"${title ? ` title="${title}"` : ''} target="_blank" rel="noopener noreferrer">${safeText}</a>`;
        }
      }
    });

    const INFO_VIEWER_LINK = { id: 'info-viewer', title: 'info_viewer', url: 'https://blog-vercel-dun.vercel.app/info_viewer/' };

    function isInfoViewerLink(link) {
      if (!link || typeof link !== 'object') return false;
      const linkId = String(link.id || '').trim();
      const linkUrl = String(link.url || '').trim().replace(/\/+$/, '');
      return linkId === INFO_VIEWER_LINK.id
        || linkUrl === '/info_viewer/index.html'
        || linkUrl === '/info_viewer'
        || linkUrl === 'https://blog-vercel-dun.vercel.app/info_viewer';
    }

    function ensureInfoViewerLink(links) {
      const normalizedLinks = Array.isArray(links) ? links.filter((link) => link && typeof link === 'object') : [];
      const result = [{ ...INFO_VIEWER_LINK }];

      normalizedLinks.forEach((link) => {
        if (isInfoViewerLink(link)) return;
        result.push(link);
      });
      return result;
    }

    // === API ヘルパー ===
    const API_BASE = '/api';
    const FOLDER_LOAD_SETTINGS_STORAGE_KEY = 'sb_folderLoadSettings';
    const NOTE_UPLOADED_VISIBILITY_MIGRATION_KEY = 'sb_noteUploadedVisibleV1';
    const ROOT_ARTICLE_LIMIT_STORAGE_KEY = 'sb_rootArticleLimit';
    const ACCESSORY_REPORTS_STORAGE_KEY = 'sb_accessoryReports';
    const ACCESSORY_MLX_ATTEMPTS_STORAGE_KEY = 'sb_accessoryMlxGenerationAttempts';
    const FOLDER_LOAD_STEP = 50;
    const DEFAULT_FOLDER_LOAD_LIMIT = 100;
    const NOTE_UPLOADED_DEFAULT_LIMIT = 5;
    const FOLDER_LOAD_LIMIT_OPTIONS = [5, 10, 25, 50, 100];
    const ROOT_ARTICLE_DEFAULT_LIMIT = 5;
    const ACCESSORY_REPORT_HISTORY_LIMIT = 10;

    function isNoteUploadedFolderPath(folderPath) {
      return String(folderPath || '')
        .normalize('NFKC')
        .split('/')
        .some(part => ['noteアップ済', 'noteアップ済み'].includes(part.trim().toLocaleLowerCase('ja-JP')));
    }

    function defaultFolderLoadSetting(folderPath = '') {
      return isNoteUploadedFolderPath(folderPath)
        ? { includeAll: true, limit: NOTE_UPLOADED_DEFAULT_LIMIT }
        : { includeAll: false, limit: DEFAULT_FOLDER_LOAD_LIMIT };
    }

    function collapseFolderSelectionPaths(values = []) {
      const paths = [...new Set(values)].sort((a, b) => a.split('/').length - b.split('/').length || a.localeCompare(b));
      return paths.filter((path, index) => !paths.slice(0, index).some(parent => path.startsWith(`${parent}/`)));
    }

    function normalizeRootArticleLimit(value) {
      const parsed = Number.parseInt(value || ROOT_ARTICLE_DEFAULT_LIMIT, 10);
      if (!Number.isFinite(parsed)) return ROOT_ARTICLE_DEFAULT_LIMIT;
      return Math.min(2000, Math.max(5, parsed));
    }

    function normalizeMlxGenerationAttempts(value) {
      const parsed = Number.parseInt(value || '1', 10);
      return [1, 2, 3].includes(parsed) ? parsed : 1;
    }

    function normalizeTitleVariantKeywords(input) {
      const source = String(input || '').normalize('NFKC').replace(/\r\n?/g, '\n');
      const values = [];
      const seen = new Set();
      source.split('\n').forEach((row) => {
        const markdownLabels = row.replace(/\[([^\]\n]+)\]\(https?:\/\/[^)\s]+\)/gi, '$1');
        markdownLabels.split('\t').forEach((rawCell) => {
          let value = rawCell
            .replace(/https?:\/\/[^\s)\]]+/gi, ' ')
            .replace(/[\u200B-\u200D\uFEFF]/g, '')
            .replace(/^\s*(?:[-*•・●○■□▪▶▼+]+\s*)+/, '')
            .replace(/(?:\s*[+]+\s*)+$/g, '')
            .replace(/^['"`「『【\[]+|['"`」』】\]]+$/g, '')
            .replace(/\s+/g, ' ')
            .trim();
          if (!value || /^[+\-–—]+$/.test(value) || /^www\./i.test(value)) return;
          value = value.replace(/[\s:：|│。．]+$/g, '').trim();
          if (!value || value.length > 120) return;
          const key = value.toLocaleLowerCase('ja-JP');
          if (seen.has(key)) return;
          seen.add(key);
          values.push(value);
        });
      });
      return values;
    }

      const jst = new Date(created.getTime() + (9 * 60 * 60 * 1000));

    function resolveFolderLoadSetting(folderPath, settings = {}) {
      const normalizedPath = String(folderPath || '').trim().replace(/^\/+|\/+$/g, '');
      const parts = normalizedPath.split('/').filter(Boolean);
      for (let length = parts.length; length > 0; length--) {
        const candidate = parts.slice(0, length).join('/');
        if (Object.prototype.hasOwnProperty.call(settings || {}, candidate)) {
          return {
            ...normalizeFolderLoadSetting(settings[candidate]),
            inherited: candidate !== normalizedPath,
            inheritedFrom: candidate !== normalizedPath ? candidate : '',
          };
        }
      }
      return { ...defaultFolderLoadSetting(normalizedPath), inherited: false, inheritedFrom: '' };
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function toDateInputValue(date) {
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    }

    function toTimeInputValue(date) {
      return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    const DEFAULT_NOTE_POST_TIME_SHORTCUTS = ['07:30', '11:30', '21:00'];
    const NOTE_POST_TIME_SHORTCUTS_STORAGE_KEY = 'sb_notePostTimeShortcuts';
    const NOTE_POST_INTERVAL_MINUTES_STORAGE_KEY = 'sb_notePostIntervalMinutes';

    function normalizeNotePostTime(value) {
      const match = String(value || '').trim().match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return '';
      const hour = Number(match[1]);
      const minute = Number(match[2]);
      if (!Number.isInteger(hour) || !Number.isInteger(minute) || hour < 0 || hour > 23 || minute < 0 || minute > 59) return '';
      return `${pad2(hour)}:${pad2(minute)}`;
    }

    function formatShortcutTime(value) {
      const normalized = normalizeNotePostTime(value);
      if (!normalized) return value;
      return `${Number(normalized.slice(0, 2))}:${normalized.slice(3)}`;
    }

    function mergeNotePostTimeShortcuts(values = []) {
      const merged = (Array.isArray(values) ? values : [])
        .map(normalizeNotePostTime)
        .filter(Boolean);
      return Array.from(new Set(merged)).sort();
    }

    function loadNotePostTimeShortcuts() {
      try {
        const raw = localStorage.getItem(NOTE_POST_TIME_SHORTCUTS_STORAGE_KEY);
        if (raw !== null) return mergeNotePostTimeShortcuts(JSON.parse(raw));
      } catch { }
      return mergeNotePostTimeShortcuts(DEFAULT_NOTE_POST_TIME_SHORTCUTS);
    }

    function saveNotePostTimeShortcuts(shortcuts) {
      try { localStorage.setItem(NOTE_POST_TIME_SHORTCUTS_STORAGE_KEY, JSON.stringify(shortcuts)); } catch { }
    }

    function normalizeNotePostIntervalMinutes(value) {
      const minutes = Number.parseInt(String(value || '').trim(), 10);
      if (!Number.isInteger(minutes) || minutes < 1 || minutes > 1440) return 0;
      return minutes;
    }

    function formatDateTimeJa(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('ja-JP', {
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function formatTimeJa(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }

    function monthLabelJa(date) {
      return `${date.getFullYear()}年 ${date.getMonth() + 1}月`;
    }

    function nextRoundedHour() {
      const date = new Date();
      date.setMinutes(0, 0, 0);
      date.setHours(date.getHours() + 1);
      return date;
    }

    const NOTE_POST_RESERVATION_STATUSES = new Set(['scheduled', 'queued']);
    const NOTE_POST_FAILED_GRACE_MS = 12 * 60 * 60 * 1000;

    function isActiveNotePostReservation(item) {
      return item && NOTE_POST_RESERVATION_STATUSES.has(item.status);
    }

    function isCancellableNotePostSchedule(item) {
      return isActiveNotePostReservation(item);
    }

    function shuffleNotePostTargets(items = []) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function makeNotePostDraft(date, time, manual = false) {
      return { date, time, manual };
    }

    function addDaysToDateKey(dateKey, days) {
      const date = new Date(`${dateKey}T00:00:00`);
      date.setDate(date.getDate() + days);
      return toDateInputValue(date);
    }

    function isFutureNotePostDraft(draft) {
      if (!draft?.date || !normalizeNotePostTime(draft.time)) return false;
      const date = new Date(`${draft.date}T${normalizeNotePostTime(draft.time)}:00`);
      return !Number.isNaN(date.getTime()) && date.getTime() > Date.now() + 60_000;
    }

    function getNextSequentialNotePostDraft(previousDraft, dailySlots = []) {
      const normalizedTime = normalizeNotePostTime(previousDraft?.time);
      if (!previousDraft?.date || !normalizedTime) {
        const fallback = nextRoundedHour();
        return makeNotePostDraft(toDateInputValue(fallback), toTimeInputValue(fallback));
      }

      let dateKey = previousDraft.date;
      const slots = Array.isArray(dailySlots) ? dailySlots.map(normalizeNotePostTime).filter(Boolean).sort() : [];
      if (slots.length === 0) {
        const fallback = new Date(`${previousDraft.date}T${normalizedTime}:00`);
        fallback.setMinutes(fallback.getMinutes() + 60);
        while (fallback.getTime() <= Date.now() + 60_000) {
          fallback.setMinutes(fallback.getMinutes() + 60);
        }
        return makeNotePostDraft(toDateInputValue(fallback), toTimeInputValue(fallback));
      }
      const slotIndex = slots.indexOf(normalizedTime);
      let nextTime = '';
      if (slotIndex >= 0 && slotIndex < slots.length - 1) {
        nextTime = slots[slotIndex + 1];
      } else if (slotIndex >= 0) {
        dateKey = addDaysToDateKey(dateKey, 1);
        nextTime = slots[0];
      } else {
        nextTime = slots.find(time => time > normalizedTime) || '';
        if (!nextTime) {
          dateKey = addDaysToDateKey(dateKey, 1);
          nextTime = slots[0];
        }
      }

      let draft = makeNotePostDraft(dateKey, nextTime);
      while (!isFutureNotePostDraft(draft)) {
        dateKey = addDaysToDateKey(draft.date, 1);
        draft = makeNotePostDraft(dateKey, slots[0]);
      }
      return draft;
    }

    function getNextDailyNotePostSlot(occupiedKeys = new Set(), occupiedDateCounts = new Map(), afterDate = new Date(), dailySlots = []) {
      const todayKey = toDateInputValue(new Date());
      const startKey = toDateInputValue(afterDate);
      const cursor = new Date(`${startKey}T00:00:00`);
      const slots = Array.isArray(dailySlots) ? dailySlots.map(normalizeNotePostTime).filter(Boolean).sort() : [];
      if (slots.length === 0) {
        const fallback = nextRoundedHour();
        while (occupiedKeys.has(`${toDateInputValue(fallback)} ${toTimeInputValue(fallback)}`)) {
          fallback.setMinutes(fallback.getMinutes() + 60);
        }
        return makeNotePostDraft(toDateInputValue(fallback), toTimeInputValue(fallback));
      }
      for (let dayOffset = 0; dayOffset < 370; dayOffset++) {
        const dateKey = toDateInputValue(cursor);
        if (dateKey < todayKey) {
          cursor.setDate(cursor.getDate() + 1);
          continue;
        }
        for (const time of slots) {
          const candidate = new Date(`${dateKey}T${time}:00`);
          if (candidate.getTime() <= Date.now() + 60_000) continue;
          if (!occupiedKeys.has(`${dateKey} ${time}`)) {
            return makeNotePostDraft(dateKey, time);
          }
        }
        cursor.setDate(cursor.getDate() + 1);
      }
      const fallback = nextRoundedHour();
      return makeNotePostDraft(toDateInputValue(fallback), toTimeInputValue(fallback));
    }

    function collectNotePostOccupiedSlots(schedules = [], drafts = {}, excludeDraftId = '') {
      const keys = new Set();
      const dateCounts = new Map();
      const add = (dateKey, time) => {
        const normalizedTime = normalizeNotePostTime(time);
        if (!dateKey || !normalizedTime) return;
        keys.add(`${dateKey} ${normalizedTime}`);
        dateCounts.set(dateKey, (dateCounts.get(dateKey) || 0) + 1);
      };

      schedules.forEach((item) => {
        if (!isActiveNotePostReservation(item) || !item.publishAt) return;
        const date = new Date(item.publishAt);
        if (Number.isNaN(date.getTime()) || date.getTime() <= Date.now() + 60_000) return;
        add(toDateInputValue(date), toTimeInputValue(date));
      });

      Object.entries(drafts || {}).forEach(([id, draft]) => {
        if (String(id) === String(excludeDraftId)) return;
        if (!draft || !draft.date) return;
        add(draft.date, draft.time);
      });

      return { keys, dateCounts };
    }

    function getPreviousConfiguredDraft(targetIds, drafts, targetId) {
      const index = targetIds.indexOf(targetId);
      for (let i = index - 1; i >= 0; i--) {
        const draft = drafts[targetIds[i]];
        if (draft?.date && normalizeNotePostTime(draft.time)) return draft;
      }
      return null;
    }

    function buildIntervalNotePostDrafts(targetIds, startDate, startTime, intervalMinutes) {
      const normalizedTime = normalizeNotePostTime(startTime);
      const minutes = normalizeNotePostIntervalMinutes(intervalMinutes);
      const start = new Date(`${startDate || ''}T${normalizedTime}:00`);
      if (!targetIds.length || !startDate || !normalizedTime || !minutes || Number.isNaN(start.getTime())) return {};

      return targetIds.reduce((acc, id, index) => {
        const date = new Date(start.getTime() + index * minutes * 60 * 1000);
        acc[id] = makeNotePostDraft(toDateInputValue(date), toTimeInputValue(date), false);
        return acc;
      }, {});
    }

    function rebuildSequentialNotePostDrafts(targetIds, drafts, startId, dailySlots = []) {
      const nextDrafts = { ...(drafts || {}) };
      const startIndex = Math.max(0, targetIds.indexOf(startId));
      let previousDraft = getPreviousConfiguredDraft(targetIds, nextDrafts, targetIds[startIndex]);

      for (let i = startIndex; i < targetIds.length; i++) {
        const id = targetIds[i];
        const current = nextDrafts[id];
        if (current?.manual && current.date && normalizeNotePostTime(current.time)) {
          previousDraft = current;
          continue;
        }
        if (i === startIndex && current?.date && normalizeNotePostTime(current.time)) {
          previousDraft = current;
          continue;
        }
        const next = previousDraft
          ? getNextSequentialNotePostDraft(previousDraft, dailySlots)
          : current;
        if (next?.date && normalizeNotePostTime(next.time)) {
          nextDrafts[id] = { ...next, manual: false };
          previousDraft = nextDrafts[id];
        }
      }

      return nextDrafts;
    }

    function getScheduleTitle(item) {
      return item?.title || item?.name || item?.fileId || '記事';
    }

    function isMissedNotePostSchedule(item, now = Date.now()) {
      if (!isActiveNotePostReservation(item) || !item.publishAt) return false;
      const publishAt = new Date(item.publishAt).getTime();
      return !Number.isNaN(publishAt) && now - publishAt > NOTE_POST_FAILED_GRACE_MS;
    }

    // === フォルダ階層構築ユーティリティ ===
    // APIから返される article.path（OneDriveの実際のフォルダ階層）を使って
    // 多段階ネストツリーを構築する
    // 戻り値: { _articles: [], subfolders: { "フォルダ名": { _articles: [], subfolders: {} } } }
    function createFolderNode(path = '') {
      return { _articles: [], subfolders: {}, _meta: { path, loaded: true, childCount: 0 } };
    }

    function ensureFolderNode(root, folderPath) {
      const parts = (folderPath || '').trim().split('/').filter(Boolean);
      let node = root;
      let acc = '';
      for (const part of parts) {
        acc = acc ? `${acc}/${part}` : part;
        if (!node.subfolders[part]) node.subfolders[part] = createFolderNode(acc);
        node = node.subfolders[part];
      }
      return node;
    }

    function buildFolderTree(articles, folderMeta = {}) {
      const root = createFolderNode('');
      Object.values(folderMeta || {}).forEach((meta) => {
        if (!meta || !meta.path) return;
        const node = ensureFolderNode(root, meta.path);
        node._meta = { ...node._meta, ...meta };
      });

      for (const article of articles) {
        const node = ensureFolderNode(root, article.path || '');
        node._articles.push(article);
      }
      return root;
    }

    function getArticleSourceType(article) {
      const name = String(article?.name || '');
      const value = String(article?.sourceType || article?.source_type || '').toLowerCase();
      if (/(^|_)AMZN_/i.test(name)) return 'amazon';
      return value === 'amazon' || value === 'amzn' ? 'amazon' : 'youtube';
    }

    function getArticleModelTags(article) {
      const name = String(article?.name || '');
      const values = [
        article?.modelType,
        article?.model_type,
        article?.generationModel,
        article?.generation_model,
      ].map((value) => String(value || '').toLowerCase());
      if (/(^|_)E4B(?:_|\.|$)/i.test(name)) return ['E4B'];
      return values.some((value) => value === 'e4b' || value.includes('gemma4:e4b')) ? ['E4B'] : [];
    }

    function getArticleFilenameTitle(name) {
      return String(name || '')
        .replace(/^\d{8}_\d{4}_/, '')
        .replace(/^AMZN_/, '')
        .replace(/\.md$/i, '');
    }

    function getArticleDisplayTitle(article, articleH1Cache = {}) {
      if (!article) return '';
      return article.h1Title
        || (articleH1Cache && articleH1Cache[article.id])
        || getArticleFilenameTitle(article.name);
    }

    function normalizeArticleSearchText(value) {
      return String(value || '').toLocaleLowerCase('ja-JP');
    }

    function countPlainTextMatches(text, keyword) {
      if (!keyword) return 0;
      let count = 0;
      let index = 0;
      const source = String(text || '');
      while (index < source.length) {
        const found = source.indexOf(keyword, index);
        if (found === -1) break;
        count++;
        index = found + keyword.length;
      }
      return count;
    }

    function HighlightedTitle({ text, keyword }) {
      const title = String(text || '');
      const query = String(keyword || '').trim();
      if (!query) return <>{title}</>;
      const normalizedTitle = normalizeArticleSearchText(title);
      const normalizedQuery = normalizeArticleSearchText(query);
      const start = normalizedTitle.indexOf(normalizedQuery);
      if (start === -1) return <>{title}</>;
      const end = start + query.length;
      return (
        <>
          {title.slice(0, start)}
          <span className="rounded bg-purple-100 px-0.5 text-purple-900">{title.slice(start, end)}</span>
          {title.slice(end)}
        </>
      );
    }

    // ノード以下の全記事数を再帰的に合計
    function countArticles(node) {
      const knownCount = node._articles.length +
        Object.values(node.subfolders).reduce((s, c) => s + countArticles(c), 0);
      const childCount = node._meta && Number.isFinite(node._meta.childCount) ? node._meta.childCount : 0;
      return node._meta && node._meta.loaded === false ? Math.max(knownCount, childCount) : knownCount;
    }

    function countLoadedArticles(node) {
      return node._articles.length +
        Object.values(node.subfolders).reduce((s, c) => s + countLoadedArticles(c), 0);
    }

    // === Toast コンポーネント ===
    function Toast({ message, type, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 3500);
        return () => clearTimeout(t);
      }, [onClose]);

      const icons = {
        success: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 6L9 17l-5-5" /></svg>,
        error: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12" /></svg>,
        info: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10" /><path d="M12 8v4m0 4h.01" /></svg>,
      };

      return (
        <div className={`toast toast-${type}`}>
          {icons[type]}
          {message}
        </div>
      );
    }

    // === リサイズフック ===
    function useResizable(initialWidth, minWidth, maxWidth) {
      const [width, setWidth] = useState(initialWidth);
      const dragging = useRef(false);
      const startX = useRef(0);
      const startW = useRef(0);

      const onMouseDown = useCallback((e) => {
        dragging.current = true;
        startX.current = e.clientX;
        startW.current = width;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      }, [width]);

      useEffect(() => {
        const onMove = (e) => {
          if (!dragging.current) return;
          const delta = e.clientX - startX.current;
          const newW = Math.min(maxWidth, Math.max(minWidth, startW.current + delta));
          setWidth(newW);
        };
        const onUp = () => {
          if (!dragging.current) return;
          dragging.current = false;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
      }, [minWidth, maxWidth]);

      return [width, onMouseDown];
    }

    // === フォルダツリー コンポーネント ===
    function FolderTree({ articles, selectedId, onSelect, loading, onDeleteArticle, onDeleteFolders, onDuplicateArticle, onMoveArticle, onSchedulePost, onBulkReplace, onCreateAccessory, onCreateTitleVariant, onOpenAccessoryReport, hiddenFolders, onHideFolder, selectMode, selectedIds, onToggleSelect, onEnterSelectMode, onMultiSelect, onRangeSelect, multiSelectedIds, scheduledPostIds = new Set(), scheduledPostMap = new Map(), missedNotePostMap = new Map(), articleH1Cache, folderMeta = {}, folderLoading = {}, onLoadFolder, folderLoadSettings = {}, onChangeFolderLoadSetting, rootArticleLimit = ROOT_ARTICLE_DEFAULT_LIMIT, onChangeRootArticleLimit, flatMode = false, searchQuery = '', contextArticles = null }) {
      const [openFolders, setOpenFolders] = useState({});
      const [ctxMenu, setCtxMenu] = useState({ visible: false, x: 0, y: 0, article: null });
      const [folderCtxMenu, setFolderCtxMenu] = useState({ visible: false, x: 0, y: 0, path: '' });
      const [rootCtxMenu, setRootCtxMenu] = useState({ visible: false, x: 0, y: 0 });
      const [rootArticleLimitInput, setRootArticleLimitInput] = useState(String(rootArticleLimit));
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [confirmFolderDelete, setConfirmFolderDelete] = useState(null);
      const [folderDeleteRunning, setFolderDeleteRunning] = useState(false);

      const [dragOver, setDragOver] = useState(null); // ドロップ先フォルダパス（マウス）
      const dragArticleRef = useRef(null); // ドラッグ中の記事

      const [swipedId, setSwipedId] = useState(null);         // 左スワイプ中の記事ID

      const [touchDragOver, _setTouchDragOver] = useState(null); // タッチドラッグ中のフォルダ

      // 子に明示設定がなければ、最も近い親フォルダの設定を継承する。
      const getFolderLoadSetting = (path) => resolveFolderLoadSetting(path, folderLoadSettings);

      const loadFolderWithSetting = (path, meta = {}, setting = getFolderLoadSetting(path)) => {
        if (!onLoadFolder) return;

          includeAll: setting.includeAll,
          articleLimit: setting.includeAll ? setting.limit : undefined,

      };

      const updateFolderLoadSetting = (path, updater, meta = {}) => {

        );

          ? onChangeFolderLoadSetting(path, requested)
          : requested;
        setOpenFolders(prev => ({ ...prev, [path]: true }));
        loadFolderWithSetting(path, meta, next || current);
      };

      useEffect(() => {
        if (visibleArticleLimit >= articles.length) return;

        let idleId = null;
        let timerId = null;

          if (cancelled) return;
          setVisibleArticleLimit(limit => Math.min(limit + 20, articles.length));
        };
        if (window.requestIdleCallback) {
          idleId = window.requestIdleCallback(run, { timeout: 300 });
        } else {
          timerId = setTimeout(run, 120);
        }
        return () => {
          cancelled = true;
          if (idleId !== null && window.cancelIdleCallback) window.cancelIdleCallback(idleId);
          if (timerId !== null) clearTimeout(timerId);
        };
      }, [articles.length, visibleArticleLimit]);

      // 初期状態: デフォルトは閉じた状態にする
      useEffect(() => {
        // 以前は第1階層を展開していたが、ユーザー要望によりデフォルトは閉じた状態に
        // const initOpen = {};
        // Object.keys(rootNode.subfolders).forEach(k => { initOpen[k] = true; });
        // setOpenFolders(initOpen);
      }, []);

      useEffect(() => {

      const toggleFolder = (path, meta) => {

          loadFolderWithSetting(path, meta);

      // ── モバイルタッチ: 長押しドラッグ & 左スワイプ ──
      const LONG_PRESS_MS = 500;

      const onArticleTouchMove = (e) => {
        const tr = touchRef.current;
        if (!tr.article) return;

        const dy = t.clientY - tr.startY;

          setDragGhostInfo(prev => prev ? { ...prev, x: t.clientX, y: t.clientY } : null);
          const el = document.elementFromPoint(t.clientX, t.clientY);
          const folderEl = el && el.closest('[data-folder-path]');

        if (tr.mode === null) {

          const dragged = dragArticleRef.current;

        touchRef.current.mode = null;

      const handleContextMenu = (e, article) => {

        if (!article) return [];

        setCtxMenu(m => ({ ...m, visible: false }));

        setRootArticleLimitInput(String(next));
        setRootCtxMenu(m => ({ ...m, visible: false }));
        setCtxMenu(m => ({ ...m, visible: false }));
      };

      const rootLoadControls = (
        <div style={{ padding: '9px 14px' }}>
          <div style={{ marginBottom: '7px', fontSize: '11px', fontWeight: 700, color: '#64748b' }}>OneDrive直下の読み込む記事数</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
            <button disabled={rootArticleLimit <= 5} onClick={() => changeRootArticleLimit(-5)} style={{ padding: '6px 10px', borderRadius: '6px', border: '1px solid #e2e8f0', background: 'white', color: rootArticleLimit <= 5 ? '#cbd5e1' : '#7C4DFF', cursor: rootArticleLimit <= 5 ? 'not-allowed' : 'pointer', fontSize: '11px', fontWeight: 700 }}>−5</button>
            <input

          <div className="text-center text-slate-400 text-xs mt-8 px-4">

              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />

      // 記事アイテムレンダリング

        const sourceType = getArticleSourceType(article);

        const scheduledPost = scheduledPostMap && scheduledPostMap.get(String(article.id));

        const missedNotePost = missedNotePostMap && missedNotePostMap.get(String(article.id));
        const hasMissedNotePost = Boolean(missedNotePost);

          ? `予約失敗: ${formatDateTimeJa(missedNotePost.publishAt)}`
          : undefined;

        const handleClick = (e) => {

              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" /></svg>
                複製

              <button
                className="swipe-action-btn"
                style={{ background: '#651FFF', color: 'white' }}
                onPointerDown={e => e.stopPropagation()}
                onClick={(e) => { e.stopPropagation(); setSwipedId(null); setConfirmDelete(article); }}
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14H6L5 6" /><path d="M10 11v6M14 11v6" /><path d="M9 6V4h6v2" /></svg>
                削除
