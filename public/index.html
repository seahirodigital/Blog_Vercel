        if (job.state === 'completed') return '元記事と同じOneDriveフォルダへの保存が完了しました';
        if (job.state === 'registration_failed') return '周辺機器DB_LLMへの登録に失敗しました';
        if (job.state === 'failed') return job.error || 'タイトル変更記事の生成に失敗しました';
        return '状態を確認しています';
      }, [titleVariantModal.worker]);

      const createAccessoryJobs = useCallback(async (engine) => {
        if (!accessoryModal.parents?.length || accessorySelectedIds.size === 0) return;
        if (engine === 'MLX' && !/Mac/i.test(navigator.platform || navigator.userAgent || '')) {
          showToast('MLXはMacからだけ依頼できます', 'error');
          return;
        }
        let launcherWindow = null;
        if (engine === 'MLX') {
          try {
            launcherWindow = window.open('', 'blogVercelMlxLauncher', 'popup,width=520,height=280');
            if (launcherWindow) {
              launcherWindow.document.title = 'Blog Vercel MLX起動';
              launcherWindow.document.body.style.cssText = 'font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:32px;line-height:1.7;color:#0f172a;background:#f8fafc';
              launcherWindow.document.body.textContent = '周辺機器ジョブを登録しています。登録後にMLXターミナルを起動します。';
            }
          } catch {
            launcherWindow = null;
          }
        }
        setAccessoryCreating(true);
        setAccessoryModal(prev => ({
          ...prev,
          error: '',
          jobs: [],
          worker: null,
          launcherUrl: '',
          launchStatus: engine === 'MLX' ? 'registering' : '',
          statusMessage: `${engine}用ジョブをOneDriveと周辺機器DB_LLMへ登録しています。`,
          lastCheckedAt: '',
        }));
        try {
          const selectedParents = accessoryModal.parents
            .map(parent => ({
              parentId: parent.id,
              parentWebUrl: parent.webUrl || '',
              parentPath: parent.path || '',
              categoryIds: (parent.categories || [])
                .filter(category => accessorySelectedIds.has(accessorySelectionKey(parent.id, category.id)))
                .map(category => category.id),
            }))
            .filter(parent => parent.categoryIds.length > 0);
          const response = await fetch('/api/accessories?action=create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              parents: selectedParents,
              engine,
              platform: navigator.platform || '',
              mlxGenerationAttempts,
            }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || '周辺機器ジョブの登録に失敗しました');
          const jobs = (data.jobs || []).map(job => ({ ...job, state: job.state || 'pending', engine, articleUrl: '', error: job.error || '' }));
          const launcherUrl = engine === 'MLX' ? mlxLauncherUrl(data.batchId) : '';
          setAccessoryModal(prev => ({
            ...prev,
            jobs,
            batchId: data.batchId || '',
            worker: data.worker || null,
            launcherUrl,
            launchStatus: engine === 'MLX' ? 'ready' : '',
            statusMessage: data.message || '周辺機器ジョブを登録しました。',
            lastCheckedAt: new Date().toISOString(),
          }));
          if (engine === 'MLX' && launcherUrl) requestMlxTerminal(data.batchId, launcherWindow);
          else if (launcherWindow && !launcherWindow.closed) launcherWindow.close();
          showToast(data.message || '周辺機器ジョブを登録しました', data.hasFailures ? 'error' : data.automatic ? 'success' : 'info');
        } catch (error) {
          if (launcherWindow && !launcherWindow.closed) launcherWindow.close();
          setAccessoryModal(prev => ({ ...prev, error: error.message }));
        } finally {
          setAccessoryCreating(false);
        }
      }, [accessoryModal.parents, accessorySelectedIds, accessorySelectionKey, mlxGenerationAttempts, mlxLauncherUrl, requestMlxTerminal]);

      const refreshAccessoryJobs = useCallback(async () => {
        const current = accessoryJobsRef.current;
        const active = current.filter(job => !['completed', 'failed', 'registration_failed'].includes(job.state));
        if (active.length === 0 || accessoryPollingRef.current) return;
        accessoryPollingRef.current = true;
        setAccessoryPolling(true);
        try {
          const parameters = accessoryModal.batchId
            ? new URLSearchParams({ action: 'status', batchId: accessoryModal.batchId })
            : new URLSearchParams({ action: 'status', jobIds: active.map(job => job.jobId).join(',') });
          const response = await fetch(`/api/accessories?${parameters.toString()}`, { cache: 'no-store' });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || '生成状態を取得できませんでした');
          const updates = new Map((data.jobs || []).map(job => [job.jobId, job]));
          const newlyCompleted = (data.jobs || []).some(job => job.state === 'completed' && !current.some(previous => previous.jobId === job.jobId && previous.state === 'completed'));
          setAccessoryModal(prev => ({
            ...prev,
            jobs: prev.jobs.map(job => updates.has(job.jobId) ? { ...job, ...updates.get(job.jobId) } : job),
            worker: data.worker || prev.worker,
            lastCheckedAt: data.checkedAt || new Date().toISOString(),
            statusMessage: data.worker?.error || data.worker?.message || prev.statusMessage,
          }));
          if (newlyCompleted) loadArticles();
        } catch (error) {
          setAccessoryModal(prev => ({ ...prev, statusMessage: `進捗の再取得に失敗しました: ${error.message}` }));
        } finally {
          accessoryPollingRef.current = false;
          setAccessoryPolling(false);
        }
      }, [loadArticles, accessoryModal.batchId]);

      const openAccessoryReport = useCallback(async (target = '') => {
        const articleId = typeof target === 'object' ? String(target?.articleId || '').trim() : '';
        const folderPath = typeof target === 'object' ? target?.folderPath : target;
        const normalizedPath = String(folderPath || '').trim().replace(/^\/+|\/+$/g, '');
        setAccessorySelectedIds(new Set());
        setAccessoryModal(prev => ({
          ...prev,
          open: true,
          loading: true,
          error: '',
          jobs: [],
          statusMessage: 'フォルダに対応する生成結果を確認しています。',
        }));

        const applyStatusReport = (data, cached = {}) => {
          const jobs = data.jobs || cached.jobs || [];
          const batchId = data.batchId || jobs[0]?.batchId || cached.batchId || '';
          const parentsById = new Map();
          jobs.forEach(job => {
            if (!job.parentId || parentsById.has(job.parentId)) return;
            parentsById.set(job.parentId, { id: job.parentId, title: job.parentTitle || '', categories: [] });
          });
          const hasMlx = jobs.some(job => job.engine === 'MLX');
          const nextReport = {
            ...cached,
            open: true,
            loading: false,
            error: '',
            batchId,
            parents: cached.parents?.length ? cached.parents : [...parentsById.values()],
            jobs,
            worker: data.worker || cached.worker || null,
            launcherUrl: cached.launcherUrl || (hasMlx ? mlxLauncherUrl(batchId) : ''),
            lastCheckedAt: data.checkedAt || new Date().toISOString(),
            statusMessage: data.worker?.error || data.worker?.message || '生成結果を取得しました。',
          };
          setAccessoryModal(prev => ({ ...prev, ...nextReport }));
          saveAccessoryReport(nextReport);
        };

        try {
          const parameters = new URLSearchParams({ action: 'status' });
          if (articleId) parameters.set('articleId', articleId);
          else parameters.set('folderPath', normalizedPath);
          const response = await fetch(`/api/accessories?${parameters.toString()}`, { cache: 'no-store' });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'フォルダの生成結果を取得できませんでした');
          applyStatusReport(data);
          return;
        } catch (serverError) {
          const folderArticleIds = new Set(
            articles
              .filter(article => normalizedPath && (article.path === normalizedPath || String(article.path || '').startsWith(`${normalizedPath}/`)))
              .map(article => String(article.id))
          );
          const reports = loadAccessoryReports();
          const matched = reports.find(report => (report.jobs || []).some(job => {
            const jobFolderPath = accessoryJobFolderPath(job);
            return (articleId && (String(job.articleId || '') === articleId || String(job.parentId || '') === articleId))
              || (job.articleId && folderArticleIds.has(String(job.articleId)))
              || (jobFolderPath && (normalizedPath === jobFolderPath || normalizedPath.startsWith(`${jobFolderPath}/`) || jobFolderPath.startsWith(`${normalizedPath}/`)));
          }));
          if (!matched?.batchId) {
            setAccessoryModal(prev => ({ ...prev, loading: false, error: serverError.message || '表示できる周辺機器の生成結果がありません' }));
            return;
          }
          try {
            const parameters = new URLSearchParams({ action: 'status', batchId: matched.batchId });
            const response = await fetch(`/api/accessories?${parameters.toString()}`, { cache: 'no-store' });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '生成状態を取得できませんでした');
            applyStatusReport(data, matched);
          } catch (fallbackError) {
            setAccessoryModal(prev => ({ ...prev, ...matched, open: true, loading: false, error: '', statusMessage: `最新状態の再取得に失敗したため、保存済みの生成結果を表示します: ${fallbackError.message}` }));
          }
        }
      }, [articles, mlxLauncherUrl]);

      const accessoryActiveJobKey = accessoryModal.jobs
        .filter(job => !['completed', 'failed', 'registration_failed'].includes(job.state))
        .map(job => job.jobId)
        .join(',');

      useEffect(() => {
        if (!accessoryModal.open || !accessoryActiveJobKey) return undefined;
        refreshAccessoryJobs();
        const timer = setInterval(refreshAccessoryJobs, 3000);
        return () => clearInterval(timer);
      }, [accessoryModal.open, accessoryActiveJobKey, refreshAccessoryJobs]);

      useEffect(() => {
        if (!accessoryModal.open || accessoryModal.jobs.length === 0) return undefined;
        setAccessoryProgressClock(Date.now());
        const timer = setInterval(() => setAccessoryProgressClock(Date.now()), 1000);
        return () => clearInterval(timer);
      }, [accessoryModal.open, accessoryModal.jobs.length]);

      const titleVariantActiveJobKey = titleVariantModal.jobs
        .filter(job => !['completed', 'failed', 'registration_failed'].includes(job.state))
        .map(job => job.jobId)
        .join(',');

      useEffect(() => {
        if (!titleVariantModal.open || !titleVariantActiveJobKey) return undefined;
        refreshTitleVariantJobs();
        const timer = setInterval(refreshTitleVariantJobs, 3000);
        return () => clearInterval(timer);
      }, [titleVariantModal.open, titleVariantActiveJobKey, refreshTitleVariantJobs]);

      // 記事削除
      const handleDeleteArticle = useCallback(async (articleOrArray) => {
        const targets = (Array.isArray(articleOrArray) ? articleOrArray : [articleOrArray]).filter(Boolean);
        if (targets.length === 0) return;

        const deletedIds = new Set();
        const errors = [];
        for (const article of targets) {
          try {
            await deleteArticleApi(article.id);
            deletedIds.add(article.id);
          } catch (e) {
            errors.push(`「${getArticleFilenameTitle(article.name)}」: ${e.message}`);
          }
        }

        if (deletedIds.size > 0) {
          setArticles(prev => prev.filter(a => !deletedIds.has(a.id)));
          setSelectedIds(new Set());
          setMultiSelectedIds(new Set());
          setSelectMode(false);
          if (selectedArticle && deletedIds.has(selectedArticle.id)) {
            setSelectedArticle(null);
            setContent('');
            setOriginalContent('');
            setIsNewArticle(false);
          }
          showToast(deletedIds.size === 1 ? '記事を削除しました' : `${deletedIds.size}件の記事を削除しました`, 'success');
        }
        if (errors.length > 0) {
          showToast(errors[0], 'error');
        }
      }, [selectedArticle]);

      // フォルダ削除（OneDriveのごみ箱へ移動）
      const handleDeleteFolders = useCallback(async (folderPaths) => {
        const targets = [...new Set((Array.isArray(folderPaths) ? folderPaths : [folderPaths]).filter(Boolean))];
        if (targets.length === 0) return { deletedPaths: [], errors: [] };
        try {
          const result = await deleteFoldersApi(targets);
          const deletedPaths = result.deletedPaths || [];
          const isDeletedPath = (path) => deletedPaths.some(parent => path === parent || path.startsWith(`${parent}/`));

          if (deletedPaths.length > 0) {
            setArticles(prev => prev.filter(article => !isDeletedPath(article.path || '')));
            setFolderMeta(prev => Object.fromEntries(
              Object.entries(prev).filter(([path]) => !isDeletedPath(path))
            ));
            if (selectedArticle && isDeletedPath(selectedArticle.path || '')) {
              setSelectedArticle(null);
              setContent('');
              setOriginalContent('');
              setIsNewArticle(false);
            }
            showToast(deletedPaths.length === 1 ? 'フォルダをごみ箱へ移動しました' : `${deletedPaths.length}件のフォルダをごみ箱へ移動しました`, 'success');
          }
          if ((result.errors || []).length > 0) {
            showToast(`${result.errors[0].path}: ${result.errors[0].error}`, 'error');
          }
          return result;
        } catch (error) {
          showToast(error.message || 'フォルダ削除に失敗しました', 'error');
          return { deletedPaths: [], errors: [{ path: targets[0], error: error.message || 'フォルダ削除に失敗しました' }] };
        }
      }, [selectedArticle]);

      // 記事複製
      const handleDuplicateArticle = useCallback(async (articleOrArray) => {
        const targets = (Array.isArray(articleOrArray) ? articleOrArray : [articleOrArray]).filter(Boolean);
        if (targets.length === 0) return;

        const createdArticles = [];
        const errors = [];
        for (const article of targets) {
          try {
            const copyName = `コピー_${article.name}`;
            const result = await duplicateArticleApi(article.id, copyName, article.path || '');
            createdArticles.push({
              id: result.id,
              name: result.name,
              path: article.path || '',
              lastModified: result.lastModified,
              webUrl: result.webUrl,
              size: result.size,
            });
          } catch (e) {
            errors.push(`「${getArticleFilenameTitle(article.name)}」: ${e.message}`);
          }
        }

        if (createdArticles.length > 0) {
          setArticles(prev => [...createdArticles, ...prev]);
          showToast(createdArticles.length === 1 ? '記事を複製しました' : `${createdArticles.length}件の記事を複製しました`, 'success');
        }
        if (errors.length > 0) {
          showToast(errors[0], 'error');
        }
      }, []);

      // Ctrl/Cmd クリック: 個別トグル
      const handleMultiSelect = useCallback((id) => {
        if (id === null) { setMultiSelectedIds(new Set()); return; }
        setMultiSelectedIds(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      }, []);

      // Shift クリック: 最後クリックから今クリックまでの範囲を選択
      const handleRangeSelect = useCallback((fromId, toId) => {
        const ids = articles.map(a => a.id);
        const fi = ids.indexOf(fromId);
        const ti = ids.indexOf(toId);
        if (fi === -1 || ti === -1) return;
        const [lo, hi] = fi < ti ? [fi, ti] : [ti, fi];
        const rangeIds = new Set(ids.slice(lo, hi + 1));
        setMultiSelectedIds(rangeIds);
      }, [articles]);

      // 記事移動（ドラッグ&ドロップ・単一 or 複数対応）
      const handleMoveArticle = useCallback(async (articleOrArray, destFolderPath) => {
        const targets = Array.isArray(articleOrArray) ? articleOrArray : [articleOrArray];
        let successCount = 0;
        for (const article of targets) {
          try {
            await moveArticleApi(article.id, destFolderPath);
            setArticles(prev => prev.map(a =>
              a.id === article.id ? { ...a, path: destFolderPath } : a
            ));
            successCount++;
          } catch (e) {
            showToast(`「${getArticleFilenameTitle(article.name)}」の移動失敗: ${e.message}`, 'error');
          }
        }
        if (successCount > 0) {
          const label = successCount === 1
            ? `「${getArticleFilenameTitle(targets[0].name)}」を移動しました`
            : `${successCount}件の記事を移動しました`;
          showToast(label, 'success');
        }
        setSelectedIds(new Set());
        setMultiSelectedIds(new Set());
        setSelectMode(false);
      }, []);

      // 記事選択
      const handleSelect = async (article) => {
        if (hasChanges && !confirm('未保存の変更があります。破棄しますか？')) return false;
        setContentLoading(true);
        setIsNewArticle(false);
        setIsEditingTitle(false);
        try {
          const text = await fetchArticleContent(article.id);
          setContent(text);
          setOriginalContent(text);
          setSelectedArticle(article);
          // H1をタイトルとして使用（なければファイル名から抽出）
          const h1Match = text.match(/^#\s+(.+)$/m);
          const h1Title = h1Match ? h1Match[1].trim() : getArticleFilenameTitle(article.name);
          setEditedTitle(h1Title);
          // H1をキャッシュ（サイドバー表示用・localStorage永続化）
          if (h1Match) {
            setArticleH1Cache(prev => {
              const next = { ...prev, [article.id]: h1Title };
              try { localStorage.setItem('sb_articleH1Cache', JSON.stringify(next)); } catch { }
              return next;
            });
          }
          // YouTube元動画URLをバックグラウンドで取得（GitHub Variables → localStorage）
          fetch(`/api/youtube-source?name=${encodeURIComponent(article.name)}`)
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (!data?.url) return;
              setYoutubeSrcUrls(prev => {
                const next = { ...prev, [article.name]: data.url };
                try { localStorage.setItem('sb_youtubeSrcUrls', JSON.stringify(next)); } catch { }
                return next;
              });
            })
            .catch(() => { }); // エラーは無視してスタックさせない
          // note下書きURLをバックグラウンドで最新取得（エラーは無視してスタックさせない）
          fetchNoteDraftUrl(article.id).then(url => {
            if (!url) return;
            setNoteDraftUrls(prev => {
              const next = { ...prev, [article.id]: url };
              try { localStorage.setItem('sb_noteDraftUrls', JSON.stringify(next)); } catch { }
              return next;
            });
          }).catch(() => { });
          return true;
        } catch (e) {
          showToast('記事の読み込みに失敗しました', 'error');
          return false;
        } finally {
          setContentLoading(false);
        }
      };

      const openGeneratedArticleInEditor = async (job) => {
        const articleId = String(job?.articleId || '').trim();
        if (!articleId) {
          showToast('生成記事のOneDrive item IDがないため、エディターで開けません', 'error');
          return;
        }
        const existing = articles.find(article => String(article.id) === articleId);
        const generatedArticle = existing || {
          id: articleId,
          name: `${String(job?.title || '生成記事').replace(/[\\/:*?"<>|\x00-\x1f]/g, ' ').trim()}.md`,
          path: accessoryJobFolderPath(job),
          lastModified: job?.completedAt || new Date().toISOString(),
          webUrl: job?.articleUrl || '',
        };
        const opened = await handleSelect(generatedArticle);
        if (!opened) return;
        setArticles(prev => mergeArticlesById(prev, [generatedArticle]));
        setAccessoryModal(prev => ({ ...prev, open: false }));
        setTitleVariantModal(prev => ({ ...prev, open: false }));
        setMobileTab('editor');
      };

      // 新規記事
      const handleNewArticle = () => {
        if (hasChanges && !confirm('未保存の変更があります。破棄しますか？')) return;
        const now = new Date();
        const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
        const timeStr = `${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
        const draftFilename = `${dateStr}_${timeStr}_新しい記事.md`;
        const draftContent = '# 新しい記事\n\nここに記事を書いてください...\n';
        setIsNewArticle(true);
        setSelectedArticle(null);
        setContent(draftContent);
        setOriginalContent('');
        setIsEditingTitle(false);
        setNewFilename(draftFilename);
      };

      // 保存（既存記事はfileIDで上書き、新規はルートフォルダに作成）
      // silent=true のとき Toast非表示（自動保存用）
      // H1キャッシュをcontentから抽出して更新するヘルパー
      const updateH1CacheFromContent = useCallback((articleId, text) => {
        if (!articleId) return;
        const h1Match = text.match(/^#\s+(.+)$/m);
        if (!h1Match) return;
        const h1Title = h1Match[1].trim();
        setArticleH1Cache(prev => {
          if (prev[articleId] === h1Title) return prev; // 変化なしなら更新しない
          const next = { ...prev, [articleId]: h1Title };
          try { localStorage.setItem('sb_articleH1Cache', JSON.stringify(next)); } catch { }
          return next;
        });
      }, []);

      const handleSave = async (silent = false) => {
        const filename = isNewArticle ? newFilename : (selectedArticle?.name || '');
        if (!filename) { if (!silent) showToast('ファイル名を指定してください', 'error'); return; }
        if (!silent) setSaving(true);
        try {
          // 既存ファイルはIDで直接上書きして、フォルダ位置を維持する
          const fileId = isNewArticle ? null : (selectedArticle?.id || null);
          const result = await saveArticle(filename, content, fileId);
          setOriginalContent(content);
          if (!silent) showToast('💾 OneDriveに保存しました！', 'success');
          if (isNewArticle && result.id) {
            const newArticle = {
              id: result.id,
              name: result.name || filename,
              path: '',
              lastModified: result.lastModified || new Date().toISOString(),
              webUrl: result.webUrl || '',
              size: result.size || content.length,
            };
            setSelectedArticle(newArticle);
            setArticles(prev => [newArticle, ...prev]);
            // 新規記事保存後にH1キャッシュを更新
            updateH1CacheFromContent(result.id, content);
          } else {
            // 既存記事保存後にH1キャッシュを更新
            updateH1CacheFromContent(selectedArticle?.id, content);
          }
          setIsNewArticle(false);
          setTimeout(async () => {
            try { await loadArticles(); }
            catch (e) { console.warn('一覧再取得失敗（保存は成功）:', e); }
          }, 1500);
        } catch (e) {
          if (!silent) showToast('保存に失敗しました: ' + e.message, 'error');
        } finally {
          if (!silent) setSaving(false);
        }
      };

      // 自動保存（既存記事のみ・2秒デバウンス）
      useEffect(() => {
        if (!selectedArticle || isNewArticle) return;
        if (content === originalContent) return;
        if (originalContent.trim() && content.trim() === '') {
          setAutoSaveStatus('idle');
          return;
        }
        setAutoSaveStatus('pending');
        clearTimeout(autoSaveTimer.current);
        autoSaveTimer.current = setTimeout(async () => {
          try {
            await saveArticle(selectedArticle.name, content, selectedArticle.id);
            setOriginalContent(content);
            setAutoSaveStatus('saved');
            // 自動保存時もH1キャッシュを更新
            updateH1CacheFromContent(selectedArticle.id, content);
            setTimeout(() => setAutoSaveStatus('idle'), 2000);
          } catch { setAutoSaveStatus('idle'); }
        }, 2000);
        return () => clearTimeout(autoSaveTimer.current);
      }, [content]);

      // ── スクロール同期ヘルパー ──────────────────────────
      // 見出しアンカーベースで同期（OGPカードで縦幅が変わっても正確に対応）
      // スクロール同期（エディタ → プレビュー）data-lineベース精密同期
      const handleEditorScroll = useCallback(() => {
        if (previewScrolling.current) return;
        const ta = textareaRef.current;
        const pv = previewRef.current;
        if (!ta || !pv) return;
        editorScrolling.current = true;
        try {
          const lines = ta.value.split('\n');
          const lineH = ta.scrollHeight / Math.max(1, lines.length);
          const topLine = Math.max(0, Math.floor(ta.scrollTop / lineH));
          // data-line属性付きのブロック要素から対応位置を計算
          const annotated = [...pv.querySelectorAll('[data-line]')];
          if (annotated.length >= 2) {
            let prev = annotated[0], next = null;
            for (const el of annotated) {
              const elLine = parseInt(el.dataset.line, 10);
              if (elLine <= topLine) prev = el;
              else if (!next) next = el;
            }
            if (next) {
              const prevLine = parseInt(prev.dataset.line, 10);
              const nextLine = parseInt(next.dataset.line, 10);
              const ratio = Math.max(0, topLine - prevLine) / Math.max(1, nextLine - prevLine);
              pv.scrollTop = prev.offsetTop + ratio * (next.offsetTop - prev.offsetTop);
            } else {
              // 最後の要素より先 → 末尾付近
              const lastEl = annotated[annotated.length - 1];
              pv.scrollTop = lastEl.offsetTop;
            }
          } else {
            // フォールバック: 比率スクロール
            const ratio = ta.scrollTop / Math.max(1, ta.scrollHeight - ta.clientHeight);
            pv.scrollTop = ratio * (pv.scrollHeight - pv.clientHeight);
          }
        } catch { }
        setTimeout(() => { editorScrolling.current = false; }, 60);

      const handlePreviewScroll = useCallback(() => {
        if (editorScrolling.current) return;
        const ta = textareaRef.current;
        const pv = previewRef.current;
        if (!ta || !pv) return;
        previewScrolling.current = true;
        try {
          const lineCount = ta.value.split('\n').length;
          const lineH = ta.scrollHeight / Math.max(1, lineCount);
          const scrollTop = pv.scrollTop;
          const annotated = [...pv.querySelectorAll('[data-line]')];
          if (annotated.length >= 2) {
            let prev = annotated[0], next = null;
            for (const el of annotated) {
              if (el.offsetTop <= scrollTop + 10) prev = el;
              else if (!next) next = el;
            }
            if (next) {
              const ratio = Math.max(0, scrollTop - prev.offsetTop) / Math.max(1, next.offsetTop - prev.offsetTop);
              const prevLine = parseInt(prev.dataset.line, 10);
              const nextLine = parseInt(next.dataset.line, 10);
              const editorLine = prevLine + ratio * (nextLine - prevLine);
              ta.scrollTop = Math.max(0, editorLine * lineH);
            } else {
              const lastLine = parseInt(prev.dataset.line, 10);
              ta.scrollTop = Math.max(0, lastLine * lineH);
            }
          } else {
            const ratio = scrollTop / Math.max(1, pv.scrollHeight - pv.clientHeight);
            ta.scrollTop = ratio * (ta.scrollHeight - ta.clientHeight);
          }

        setTimeout(() => { previewScrolling.current = false; }, 60);

        const pos = ta.selectionStart;
        const lineStart = ta.value.lastIndexOf('\n', pos - 1) + 1;
        const line = ta.value.substring(lineStart, pos).trim();
        if (!line.startsWith('http')) return;
        try {
          new URL(line);
          if (ogpCacheRef.current[line]) return; // キャッシュ済みはスキップ
          // キャンセルされない独立したバックグラウンドフェッチ
          fetch(`/api/ogp?url=${encodeURIComponent(line)}`)
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (!data) return;
              const { title, description, image, domain } = data;
              const isGeneric = !title || /^Amazon[\.\s]/.test(title) || title === 'Amazon.co.jp';
              if (isGeneric && !image) return;
              ogpCacheRef.current[line] = { title, description, image, domain };

            const startId = activeNotePostTarget?.id || targetIds[0];
            return rebuildSequentialNotePostDrafts(targetIds, prev, startId, next);
          });
        }
        saveNotePostTimeShortcuts(next);
      };

      const removeNotePostTimeShortcut = () => {
        const normalized = normalizeNotePostTime(notePostIntervalMode ? notePostIntervalStartTime : (activeNotePostDraft?.time || notePostTime));
        if (!normalized) {
          showToast('削除する時間を選択してください', 'error');
          return;
        }
        if (!notePostTimeShortcuts.includes(normalized)) {
          showToast(`${formatShortcutTime(normalized)} は保存済みの時間枠ではありません`, 'info');
          return;
        }

        const next = mergeNotePostTimeShortcuts(notePostTimeShortcuts.filter(time => time !== normalized));
        const fallbackTime = next.find(time => time > normalized) || next[0] || normalized;
        setNotePostTimeShortcuts(next);
        setNotePostTime(fallbackTime);
        if (notePostIntervalMode) {
          setNotePostIntervalStartTime(fallbackTime);
          rebuildNotePostIntervalDrafts(notePostIntervalStartDate, fallbackTime, notePostIntervalMinutes);
          saveNotePostTimeShortcuts(next);
          showToast(`${formatShortcutTime(normalized)} を時間枠から削除しました`, 'success');
          return;
        }
        setNotePostScheduleDrafts(prev => {
          const targetIds = selectedPostTargets.map(target => target.id);
          const startId = activeNotePostTarget?.id || targetIds[0];
          const updated = { ...(prev || {}) };
          if (activeNotePostTarget) {
            updated[activeNotePostTarget.id] = {
              ...(updated[activeNotePostTarget.id] || {}),
              time: fallbackTime,
              manual: true,
            };
          }
          return rebuildSequentialNotePostDrafts(targetIds, updated, startId, next);
        });
        saveNotePostTimeShortcuts(next);
        showToast(`${formatShortcutTime(normalized)} を時間枠から削除しました`, 'success');
      };

      const toggleNotePostIntervalMode = () => {
        setNotePostIntervalMode(prev => {
          const next = !prev;
          if (next) {
            const startDate = notePostIntervalStartDate || activeNotePostDraft?.date || notePostSelectedDate;
            const startTime = normalizeNotePostTime(notePostIntervalStartTime || activeNotePostDraft?.time || notePostTime) || toTimeInputValue(nextRoundedHour());
            setNotePostIntervalStartDate(startDate);
            setNotePostIntervalStartTime(startTime);
            setNotePostSelectedDate(startDate);
            setNotePostTime(startTime);
            rebuildNotePostIntervalDrafts(startDate, startTime, notePostIntervalMinutes);
          }
          return next;
        });
      };

      const handleNotePostIntervalMinutesChange = (value) => {
        const cleaned = String(value || '').replace(/[^\d]/g, '');
        setNotePostIntervalMinutes(cleaned);
        try { localStorage.setItem(NOTE_POST_INTERVAL_MINUTES_STORAGE_KEY, cleaned); } catch { }
        const minutes = normalizeNotePostIntervalMinutes(cleaned);
        if (notePostIntervalMode && minutes) {
          rebuildNotePostIntervalDrafts(notePostIntervalStartDate, notePostIntervalStartTime, minutes);
        }
      };

      const resetNotePostModal = useCallback(() => {
        setNotePostModalOpen(false);
        setNotePostTargetIds([]);
        setNotePostActiveTargetId('');
        setNotePostScheduleDrafts({});
        setNotePostCalendarSelectMode(false);
        setSelectedNotePostDates(new Set());
        setNotePostIntervalMode(false);
      }, []);

      const closeNotePostModal = useCallback(() => {
        if (notePostRunning) return;
        resetNotePostModal();
      }, [notePostRunning, resetNotePostModal]);

      const openNotePostModal = (options = {}) => {
        const requestedIds = Array.isArray(options.ids) && options.ids.length > 0
          ? options.ids
          : currentPostTargetIds;
        const knownIds = Array.from(new Set(requestedIds.map(String))).filter(id =>
          articles.some(article => article.id === id) || selectedArticle?.id === id
        );
        if (knownIds.length === 0) {
          showToast('記事を選択してください', 'error');
          return;
        }
        const isScheduleMode = (options.mode || 'now') === 'schedule';
        const availableIds = isScheduleMode
          ? knownIds.filter(id => !scheduledPostIds.has(String(id)))
          : knownIds;
        const excludedCount = knownIds.length - availableIds.length;
        if (excludedCount > 0) {
          showToast(`${excludedCount}件は既に予約済みのため対象から外しました`, 'info');
        }
        if (availableIds.length === 0) {
          showToast('選択した記事はすべて予約済みです', 'info');
          return;
        }
        const firstDraft = getNextNotePostDraft({}, availableIds[0]);
        const initialDrafts = { [availableIds[0]]: firstDraft };
        setNotePostTargetIds(availableIds);
        setNotePostActiveTargetId(availableIds[0]);
        setNotePostScheduleDrafts(initialDrafts);
        setNotePostIntervalMode(false);
        if (firstDraft) {
          setNotePostSelectedDate(firstDraft.date);
          setNotePostTime(firstDraft.time);
          setNotePostIntervalStartDate(firstDraft.date);
          setNotePostIntervalStartTime(firstDraft.time);
          const firstDate = new Date(`${firstDraft.date}T00:00:00`);
          if (!Number.isNaN(firstDate.getTime())) setNotePostMonth(new Date(firstDate.getFullYear(), firstDate.getMonth(), 1));
        }
        setNotePostMode(options.mode || 'now');
        setNotePostModalOpen(true);
      };

      const handleNotePostSubmit = async (mode = notePostMode) => {
        const targets = selectedPostTargets;
        if (targets.length === 0) { showToast('記事を選択してください', 'error'); return; }

        if (hasChanges) {
          const shouldSave = confirm('未保存の変更があります。先に保存してから公開投稿を開始しますか？');
          if (!shouldSave) return;
          await handleSave();
        }

        let publishAt = '';
        let scheduleItems = [];
        let postTargets = targets;
        if (mode === 'schedule') {
          let scheduleDrafts = targets.map(target => notePostScheduleDrafts[target.id]);
          if (notePostIntervalMode) {
            const normalizedStartTime = normalizeNotePostTime(notePostIntervalStartTime);
            const intervalMinutes = normalizeNotePostIntervalMinutes(notePostIntervalMinutes);
            if (!notePostIntervalStartDate || !normalizedStartTime) {
              showToast('時間置き指定の開始日時を確認してください', 'error');
              return;
            }
            if (!intervalMinutes) {
              showToast('時間置き指定の分数は1〜1440分で入力してください', 'error');
              return;
            }
            const intervalDrafts = buildIntervalNotePostDrafts(
              targets.map(target => target.id),
              notePostIntervalStartDate,
              normalizedStartTime,
              intervalMinutes,
            );
            scheduleDrafts = targets.map(target => intervalDrafts[target.id]);
            setNotePostScheduleDrafts(intervalDrafts);
          }
          postTargets = notePostRandomOrder && targets.length > 1 ? shuffleNotePostTargets(targets) : targets;
          for (let i = 0; i < postTargets.length; i++) {
            const slotTarget = targets[i];
            const target = postTargets[i];
            const draft = scheduleDrafts[i];
            const normalizedTime = normalizeNotePostTime(draft?.time);
            if (!draft?.date || !normalizedTime) {
              setNotePostActiveTargetId(slotTarget.id);
              showToast(`「${slotTarget.title}」の予約日時を確認してください`, 'error');
              return;
            }
            const localDate = new Date(`${draft.date}T${normalizedTime}:00`);
            if (Number.isNaN(localDate.getTime())) {
              setNotePostActiveTargetId(slotTarget.id);
              showToast(`「${slotTarget.title}」の予約日時を確認してください`, 'error');
              return;
            }
            if (localDate.getTime() <= Date.now() + 60_000) {
              setNotePostActiveTargetId(slotTarget.id);
              showToast(`「${slotTarget.title}」の予約日時は現在時刻より後にしてください`, 'error');
              return;
            }
            scheduleItems.push({
              fileId: target.id,
              title: target.title,
              name: target.name,
              path: target.path,
              publishAt: localDate.toISOString(),
            });
          }
          publishAt = scheduleItems[0]?.publishAt || '';
        }

        setNotePostRunning(true);
        try {
          await triggerNotePost(postTargets.map(target => target.id), {
            mode,
            publishAt,
            scheduleItems,
            articles: postTargets,
          });
          if (mode === 'schedule') {
            showToast(`${targets.length}件のnote公開予約を登録しました`, 'success');
            await loadNotePostSchedules();
          } else {
            showToast(`${targets.length}件のnote公開投稿を開始しました。GitHub Actionsで進捗を確認してください。`, 'info');
            resetNotePostModal();
          }
          if (selectMode) { setSelectMode(false); setSelectedIds(new Set()); }
        } catch (e) {
          showToast('note公開投稿に失敗: ' + e.message, 'error');
        } finally {
          setNotePostRunning(false);
        }
      };

      const handleCancelNotePostSchedule = async (scheduleId) => {
        try {
          const data = await cancelNotePostSchedule(scheduleId);
          setNotePostSchedules(data.schedules || []);
          showToast('note公開予約をキャンセルしました', 'success');
        } catch (e) {
          showToast('予約キャンセルに失敗: ' + e.message, 'error');
        }
      };

      const handleCancelSelectedDateSchedules = async () => {
        const targets = selectedDateCancellableSchedules;
        if (targets.length === 0) {
          showToast('削除できる予約はありません', 'info');
          return;
        }

        setNotePostRunning(true);
        try {
          const data = await cancelNotePostSchedules(targets.map(item => item.id));
          setNotePostSchedules(data.schedules || []);
          showToast(`${targets.length}件のnote公開予約を削除しました`, 'success');
        } catch (e) {
          showToast('予約削除に失敗: ' + e.message, 'error');
        } finally {
          setNotePostRunning(false);
        }
      };

      // 予約カレンダーの選択削除
      const toggleNotePostCalendarDate = useCallback((dateKey) => {
        setSelectedNotePostDates(prev => {
          const next = new Set(prev);
          if (next.has(dateKey)) next.delete(dateKey);
          else next.add(dateKey);
          return next;
        });
      }, []);

      const handleCancelCalendarSelectedSchedules = async () => {
        const targets = selectedCalendarCancellableSchedules;
        if (selectedNotePostDates.size === 0) return;
        if (targets.length === 0) {
          showToast('選択した日付に削除できる予約はありません', 'info');
          return;
        }

        setNotePostRunning(true);
        try {
          const data = await cancelNotePostSchedules(targets.map(item => item.id));
          setNotePostSchedules(data.schedules || []);
          setSelectedNotePostDates(new Set());
          showToast(`${targets.length}件のnote公開予約を削除しました`, 'success');
        } catch (e) {
          showToast('予約削除に失敗: ' + e.message, 'error');
        } finally {
          setNotePostRunning(false);
        }
      };

      const handleCancelAllNotePostSchedules = async () => {
        const targets = allCancellableNotePostSchedules;
        if (targets.length === 0) {
          showToast('削除できる予約はありません', 'info');
          return;
        }
        if (!confirm(`現在予約されている${targets.length}件をすべて削除します。本当に消してよいですか？`)) return;

        setNotePostRunning(true);
        try {
          const data = await cancelNotePostSchedules([], { cancelAll: true });
          setNotePostSchedules(data.schedules || []);
          setSelectedNotePostDates(new Set());
          setNotePostCalendarSelectMode(false);
          showToast(`${targets.length}件のnote公開予約をすべて削除しました`, 'success');
        } catch (e) {
          showToast('全予約削除に失敗: ' + e.message, 'error');
        } finally {
          setNotePostRunning(false);
        }
      };

      // note下書き投稿（単体 or 複数選択）
      const handleNoteDraft = async () => {
        // 複数選択モード
        const targetIds = selectMode && selectedIds.size > 0
          ? Array.from(selectedIds)
          : selectedArticle ? [selectedArticle.id] : [];

        if (targetIds.length === 0) { showToast('記事を選択してください', 'error'); return; }

        if (hasChanges && !confirm('未保存の変更があります。先に保存しますか？\n「OK」で保存後に投稿、「キャンセル」で現在の保存済み版を投稿')) {
          return;
        }
        if (hasChanges) await handleSave();

        setNoteDraftRunning(true);
        try {
          await triggerNoteDraft(targetIds);
          const count = targetIds.length;
          showToast(`📝 ${count}件のnote下書き投稿を開始しました！GitHub Actionsで進捗を確認してください。`, 'info');
          // 選択モードを解除
          if (selectMode) { setSelectMode(false); setSelectedIds(new Set()); }
          // 完了後にURLをpolling（最大2分、5秒間隔）
          pollDraftUrls(targetIds);
        } catch (e) {
          showToast('❌ note下書き投稿に失敗: ' + e.message, 'error');
        } finally {
          setNoteDraftRunning(false);
        }
      };

      // 完了URLをpollingで取得
      const pollDraftUrls = async (fileIds) => {
        const pending = new Set(fileIds);
        for (let attempt = 0; attempt < 24 && pending.size > 0; attempt++) {
          await new Promise(r => setTimeout(r, 5000));
          for (const id of Array.from(pending)) {
            const url = await fetchNoteDraftUrl(id);
            if (url) {
              setNoteDraftUrls(prev => {
                const next = { ...prev, [id]: url };
                try { localStorage.setItem('sb_noteDraftUrls', JSON.stringify(next)); } catch { }
                return next;
              });
              pending.delete(id);
            }
          }
        }
      };

      // タイトル編集確定（OneDriveでファイルリネーム + articlesリスト更新）
      const commitTitleEdit = async () => {
        if (!selectedArticle || !editedTitle.trim()) {
          setIsEditingTitle(false);
          return;
        }
        const match = selectedArticle.name.match(/^(\d{8}_\d{4}_)/);
        const prefix = match ? match[1] : '';
        const newName = `${prefix}${editedTitle.trim()}.md`;

        // 名前が変わっていなければ何もしない
        if (newName === selectedArticle.name) {
          setIsEditingTitle(false);
          return;
        }

        try {
          const result = await renameArticleApi(selectedArticle.id, newName);
          const renamed = { ...selectedArticle, name: result.name || newName };
          // selectedArticle と articles リストの両方を更新
          setSelectedArticle(renamed);
          setArticles(prev => prev.map(a => a.id === selectedArticle.id ? renamed : a));
          showToast('✏️ タイトルを変更しました', 'success');
        } catch (e) {
          showToast('タイトル変更に失敗しました: ' + e.message, 'error');
        } finally {
          setIsEditingTitle(false);
        }
      };

      // Markdown プレビュー（複数改行を <br> で保持）+ トークン行マップ構築
      const renderedHTML = useMemo(() => {
        try {
          const processed = (content || '').replace(/\n{3,}/g, (m) => {
            const extra = m.length - 2;
            return '\n\n' + Array(extra).fill('<br>').join('\n') + '\n\n';
          });
          // トークン行マップ構築（スクロール同期用）
          try {
            const tokens = marked.lexer(processed);
            const map = [];
            let lineNum = 0;
            for (const token of tokens) {
              if (['paragraph', 'heading', 'code', 'blockquote', 'list', 'table', 'hr', 'html', 'space'].includes(token.type)) {
                if (token.type !== 'space') {
                  map.push({ line: lineNum, type: token.type });
                }
              }
              if (token.raw) lineNum += (token.raw.match(/\n/g) || []).length;
            }
            tokenLineMapRef.current = map;
          } catch { tokenLineMapRef.current = []; }
          return marked.parse(processed);
        } catch { return '<p>Markdownの解析に失敗しました</p>'; }
      }, [content]);

      // プレビュー要素に data-line（ソース行番号）を付与（スクロール同期用）
      useLayoutEffect(() => {
        const pv = previewRef.current;
        if (!pv) return;
        const map = tokenLineMapRef.current;
        if (!map.length) return;
        // プレビュー直下のブロック要素を取得（marked出力の直接子要素）
        const blocks = [...pv.children].filter(el =>
          /^(P|H[1-6]|UL|OL|PRE|BLOCKQUOTE|TABLE|HR|DIV)$/.test(el.tagName)
        );
        let mapIdx = 0;
        for (const el of blocks) {
          if (mapIdx >= map.length) break;
          el.dataset.line = String(map[mapIdx].line);
          mapIdx++;
        }
      }, [renderedHTML]);

      // キャッシュ済みOGPカードをDOMリセット直後に即時再適用（塗り前に実行）
      // → エディタ編集中もOGPカードが消えない
      // ※ renderedHTML の useMemo より後に定義すること（const TDZ回避）
      useLayoutEffect(() => {
        const preview = previewRef.current;
        if (!preview || !Object.keys(ogpCacheRef.current).length) return;
        [...preview.querySelectorAll('a[href^="http"]:not(.ogp-card)')].forEach(a => {
          if (!isOgpUrl(a)) return;
          const href = a.getAttribute('href');
          const cached = ogpCacheRef.current[href];
          if (cached) {
            a.dataset.ogpProcessed = '1'; // 重複fetch防止
            insertOgpCard(a, buildOgpCard(href, cached.title, cached.description, cached.image, cached.domain));
          }
        });
      }, [renderedHTML]);

      // OGPカード変換（renderedHTML変更後にpreview DOMを走査）
      // キャッシュ利用・2並列スタガー・自動リトライ対応
      useEffect(() => {
        const preview = previewRef.current;
        if (!preview) return;
        let aborted = false;

        // 未処理の素URLリンクのみ取得（.ogp-card は絶対除外）
        const getUnprocessed = () =>
          [...preview.querySelectorAll('a[href^="http"]:not(.ogp-card)')].filter(a => {
            if (a.dataset.ogpProcessed) return false;
            return isOgpUrl(a);
          });

        // URLがAmazon系かどうか判定
        const isAmazonHref = (href) =>
          /amazon\.(co\.jp|com|co\.uk|de|fr)/.test(href) ||
          href.includes('amzn.to') || href.includes('amzn.asia');

        const delay = (ms) => new Promise(r => setTimeout(r, ms));

        // Amazon以外: 2並列ワーカー / Amazon: シングルワーカー（長め間隔）
        const runWorkers = async (items) => {
          const queue = [...items];

          const processOne = async (a) => {
            if (!a || a.dataset.ogpProcessed || a.classList.contains('ogp-card')) return false;
            if (!a.isConnected) return false;
            a.dataset.ogpProcessed = '1';
            const href = a.getAttribute('href');
            const isAmz = isAmazonHref(href);
            try {
              const r = await fetch(`/api/ogp?url=${encodeURIComponent(href)}`);
              if (r.ok) {
                const { title, description, image, domain } = await r.json();
                const isGeneric = !title || /^Amazon[\.\s]/.test(title) || title === 'Amazon.co.jp';
                if ((!isGeneric || image) && !aborted && a.isConnected) {
                  ogpCacheRef.current[href] = { title, description, image, domain };
                  insertOgpCard(a, buildOgpCard(href, title, description, image, domain));
                  return true;
                }
              }
            } catch { }
            if (!aborted && a.isConnected) a.removeAttribute('data-ogp-processed');
            return false;
          };

          const amazonItems = queue.filter(a => isAmazonHref(a.getAttribute('href') || ''));
          const otherItems = queue.filter(a => !isAmazonHref(a.getAttribute('href') || ''));

          // Amazon以外: 2並列ワーカー（500ms間隔）
          const runOther = async (startDelay = 0) => {
            if (startDelay) await delay(startDelay);
            while (!aborted) {
              const a = otherItems.shift();
              if (!a) break;
              await processOne(a);
              if (!aborted) await delay(500);
            }
          };

          // Amazon: シングルワーカー（2000ms間隔でレート制限を確実回避）
          const runAmazon = async () => {
            for (const a of amazonItems) {
              if (aborted) break;
              await processOne(a);
              if (!aborted) await delay(2200);
            }
          };

          await Promise.all([runOther(0), runOther(300), runAmazon()]);
        };

        // 最大4回の自動リトライ（失敗リンクが残っていれば2秒後に再実行）
        const processWithRetry = async () => {
          for (let attempt = 0; attempt < 4 && !aborted; attempt++) {
            const items = getUnprocessed();
            if (items.length === 0) break;
            await runWorkers(items);
            if (aborted) break;
            if (getUnprocessed().length === 0) break;
            await delay(2000);
          }
          // 最終フォールバック: 全リトライ後も残った素URLリンクを最低限カード化
          if (!aborted) {
            getUnprocessed().forEach(a => {
              if (!a.isConnected) return;
              const href = a.getAttribute('href') || '';
              let domain = '';
              try { domain = new URL(href).hostname; } catch { }
              if (!domain) return;
              a.dataset.ogpProcessed = '1';
              const asin = href.match(/\/dp\/([A-Z0-9]{10})/)?.[1];
              const fallbackTitle = asin ? `Amazon商品 (${asin})` : null;
              ogpCacheRef.current[href] = { title: fallbackTitle, description: null, image: null, domain };
              insertOgpCard(a, buildOgpCard(href, fallbackTitle, null, null, domain));
            });
          }
        };

        processWithRetry();
        return () => { aborted = true; };
      }, [renderedHTML, ogpTrigger]);

      // OGP更新: .ogp-card（成功済み）は完全スキップ、失敗<a>のみ再試行
      const refreshOgp = useCallback(() => {
        if (previewRef.current) {
          // .ogp-card でない <a> の data-ogp-processed を除去（成功カードに触れない）
          previewRef.current.querySelectorAll('a[data-ogp-processed]:not(.ogp-card)').forEach(a => {
            a.removeAttribute('data-ogp-processed');
          });
        }
        setOgpTrigger(t => t + 1);
      }, []);

      // 検索・置換ナビゲーション
      const goNextMatch = useCallback(() => {
        if (findMatches.length === 0) return;
        const next = (safeMatchIndex + 1) % findMatches.length;
        setMatchIndex(next);
        const pos = findMatches[next];
        const ta = textareaRef.current;
        if (ta) { ta.setSelectionRange(pos, pos + findText.length); ta.focus(); }
      }, [findMatches, safeMatchIndex, findText]);

      const goPrevMatch = useCallback(() => {
        if (findMatches.length === 0) return;
        const prev = (safeMatchIndex - 1 + findMatches.length) % findMatches.length;
        setMatchIndex(prev);
        const pos = findMatches[prev];
        const ta = textareaRef.current;
        if (ta) { ta.setSelectionRange(pos, pos + findText.length); ta.focus(); }
      }, [findMatches, safeMatchIndex, findText]);

      const handleReplaceOne = useCallback(() => {
        if (findMatches.length === 0) return;
        const pos = findMatches[safeMatchIndex];
        const newC = content.substring(0, pos) + replaceText + content.substring(pos + findText.length);
        setContent(newC);
        setMatchIndex(Math.min(safeMatchIndex, Math.max(0, findMatches.length - 2)));
      }, [findMatches, safeMatchIndex, content, findText, replaceText]);

      const handleReplaceAll = useCallback(() => {
        if (findMatches.length === 0) return;
        setContent(content.split(findText).join(replaceText));
        setMatchIndex(0);
      }, [findMatches, content, findText, replaceText]);

      // キーボードショートカット（Ctrl+S / Ctrl+B / Ctrl+F）
      useEffect(() => {
        const handler = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); handleSave(); }
          if (e.key === 'Escape' && isEditingTitle) { setIsEditingTitle(false); }
          if (e.key === 'Escape' && showFindReplace) { setShowFindReplace(false); textareaRef.current?.focus(); }
          // Ctrl+F: 検索パネルの開閉

            e.preventDefault();
            const ta = textareaRef.current;
            if (ta) {
              const start = ta.selectionStart;
              const end = ta.selectionEnd;
              const sel = content.substring(start, end);
              const newC = content.substring(0, start) + '**' + sel + '**' + content.substring(end);
              setContent(newC);
              setTimeout(() => { ta.selectionStart = start + 2; ta.selectionEnd = end + 2; ta.focus(); }, 0);
            }
          }
          // Esc: 複数選択解除
          if (e.key === 'Escape' && multiSelectedIds.size > 0) {
            setMultiSelectedIds(new Set());
            return;
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);

                    <div className="mt-6 flex items-center justify-end gap-2">

                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={handleCancelAllNotePostSchedules}
                          disabled={notePostRunning || allCancellableNotePostSchedules.length === 0}
                          className={`rounded-lg border border-rose-200 px-3 py-1.5 text-xs font-bold text-rose-500 hover:bg-rose-50 disabled:border-slate-200 disabled:text-slate-300 disabled:hover:bg-transparent ${notePostCalendarSelectMode ? 'hidden' : ''}`}
                          title="現在予約されている投稿をすべて削除"
                        >
                          予約を全て削除
                        </button>
                        {notePostCalendarSelectMode && selectedNotePostDates.size > 0 && (
                          <button
                            type="button"
                            onClick={handleCancelCalendarSelectedSchedules}
                            disabled={notePostRunning || selectedCalendarCancellableSchedules.length === 0}
                            className="rounded-lg bg-rose-500 px-3 py-1.5 text-xs font-bold text-white shadow-sm shadow-rose-100 transition-colors hover:bg-rose-600 disabled:bg-slate-300 disabled:shadow-none"

                          >
                            削除
                          </button>
                        )}
                        <button
                          type="button"
                          onClick={() => {
                            setNotePostCalendarSelectMode(prev => !prev);
                            setSelectedNotePostDates(new Set());

                              ? 'border-[#7C4DFF] bg-purple-50 text-[#7C4DFF]'

                            } disabled:opacity-50`}

                        >
                          &lt;
                        </button>
                        <button
                          type="button"
                          onClick={() => setNotePostMonth(prev => new Date(prev.getFullYear(), prev.getMonth() + 1, 1))}
                          className="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-bold text-slate-500 hover:bg-slate-50"
                          title="次の月"
                        >
                          &gt;
                        </button>
                        <button
                          type="button"
                          onClick={loadNotePostSchedules}
                          disabled={notePostScheduleLoading}
                          className="rounded-lg border border-purple-200 px-3 py-1.5 text-xs font-bold text-[#7C4DFF] hover:bg-purple-50 disabled:opacity-50"

                          {notePostScheduleLoading ? '更新中' : '更新'}

                      </div>
                    </div>

                    <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-bold">

                          key={day}
                          className={`py-1 ${index === 5 ? 'text-blue-500' : index === 6 ? 'text-rose-500' : 'text-slate-400'}`}
                        >
                          {day}
                        </div>
                      ))}
                    </div>
                    <div className="mt-1 grid grid-cols-7 gap-1">
                      {notePostCalendarDays.map((day) => {
                        const key = toDateInputValue(day);
                        const schedules = notePostSchedulesByDate[key] || [];
                        const isCurrentMonth = day.getMonth() === notePostMonth.getMonth();
                        const isSelected = key === notePostSelectedDate;
                        const isChecked = selectedNotePostDates.has(key);
                        const isToday = key === toDateInputValue(new Date());
                        const dayOfWeek = day.getDay();
                        const dateTextClass = dayOfWeek === 6
                          ? 'text-blue-500'
                          : dayOfWeek === 0
                            ? 'text-rose-500'
                            : isToday
                              ? 'text-[#7C4DFF]'
                              : 'text-slate-500';
                        return (
                          <div
                            key={key}
                            role="button"
                            tabIndex={0}
                            onClick={() => {
                              if (notePostCalendarSelectMode) {
                                toggleNotePostCalendarDate(key);
                                return;
                              }
                              updateActiveNotePostDraft({ date: key });
                              setNotePostMode('schedule');
                            }}
                            onKeyDown={(e) => {
                              if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                if (notePostCalendarSelectMode) {
                                  toggleNotePostCalendarDate(key);
                                  return;
                                }
                                updateActiveNotePostDraft({ date: key });
                                setNotePostMode('schedule');
                              }
                            }}
                            className={`min-h-[86px] min-w-0 cursor-pointer rounded-md border p-1.5 text-left transition-colors ${isChecked
                                ? 'border-rose-300 bg-rose-50'
                                : isSelected
                                ? 'border-[#7C4DFF] bg-purple-50'
                                : 'border-slate-200 bg-white hover:border-purple-200 hover:bg-purple-50/40'
                            } ${isCurrentMonth ? 'opacity-100' : 'opacity-40'}`}
                          >
                            <div className="mb-1 flex items-center justify-between">
                              <div className="flex items-center gap-1">
                                <span className={`text-xs font-bold ${dateTextClass}`}>{day.getDate()}</span>
                                {notePostCalendarSelectMode && (
                                  <input
                                    type="checkbox"
                                    checked={isChecked}
                                    onChange={(e) => {
                                      e.stopPropagation();
                                      toggleNotePostCalendarDate(key);
                                    }}
                                    onClick={(e) => e.stopPropagation()}
                                    className="h-3 w-3 accent-[#7C4DFF]"
                                    aria-label={`${key} を選択`}
                                  />
                                )}
                              </div>
                              {schedules.length > 0 && <span className="rounded-full bg-[#7C4DFF] px-1.5 py-0.5 text-[10px] font-bold text-white">{schedules.length}</span>}

                              {schedules.slice(0, 2).map((item) => (
                                <div key={item.id} className="relative min-w-0 overflow-hidden rounded bg-white py-1 pl-1.5 pr-5 shadow-sm">

                                    <button
                                      type="button"
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        handleCancelNotePostSchedule(item.id);
                                      }}
                                      className="absolute right-1 top-1 flex h-4 w-4 items-center justify-center rounded-full bg-rose-50 text-[10px] font-bold text-rose-500 hover:bg-rose-100"
                                      title="この予約を削除"
                                    >
                                      ✗
                                    </button>
                                  )}
                                  <p className="truncate text-[10px] font-bold text-slate-700">{formatTimeJa(item.publishAt)} {getScheduleTitle(item)}</p>
                                  <p className="truncate text-[9px] text-slate-400">登録 {formatDateTimeJa(item.createdAt)}</p>
                                </div>
                              ))}
                              {schedules.length > 2 && <p className="text-[10px] font-bold text-slate-400">+{schedules.length - 2}</p>}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    <div className="mt-4 rounded-lg border border-slate-200 bg-slate-50 p-3">

                        <div className="flex items-center gap-2">
                          <span className="text-[11px] font-semibold text-slate-400">{selectedDateSchedules.length}件</span>
                          <button
                            type="button"
                            onClick={handleCancelSelectedDateSchedules}
                            disabled={notePostRunning || selectedDateCancellableSchedules.length === 0}
                            className="rounded border border-rose-100 bg-rose-50 px-2 py-1 text-[11px] font-bold text-rose-500 hover:bg-rose-100 disabled:border-slate-200 disabled:bg-slate-100 disabled:text-slate-300"
                            title={`${notePostSelectedDate} の予約を一括削除`}
                          >
                            一括削除
                          </button>
                        </div>
                      </div>
                      {selectedDateSchedules.length === 0 ? (
                        <p className="py-4 text-center text-xs text-slate-400">予約はありません</p>
                      ) : (
                        <div className="max-h-44 space-y-2 overflow-y-auto">
                          {selectedDateSchedules.map((item) => (
                            <div key={item.id} className="flex items-start justify-between gap-3 rounded-md border border-slate-200 bg-white px-3 py-2">
                              <div className="min-w-0">
                                <p className="truncate text-xs font-bold text-slate-800">{formatTimeJa(item.publishAt)} {getScheduleTitle(item)}</p>
                                <p className="mt-0.5 text-[11px] text-slate-400">登録 {formatDateTimeJa(item.createdAt)} / {item.status}</p>
                              </div>
                              {isCancellableNotePostSchedule(item) && (
                                <button
                                  type="button"
                                  onClick={() => handleCancelNotePostSchedule(item.id)}
                                  className="rounded border border-rose-100 bg-rose-50 px-2 py-1 text-[11px] font-bold text-rose-500 hover:bg-rose-100"
                                >
                                  取消
                                </button>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* メインコンテンツ */}
          <main className="flex-1 flex flex-col min-w-0 h-screen">
            {/* ツールバー */}
            <header className="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center gap-3 shrink-0 min-h-[52px]">
              {/* ハンバーガーメニュー（モバイルのみ） */}
              <button
                className="lg:hidden p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors flex-shrink-0"
                onClick={() => setMobileSidebarOpen(true)}
                id="hamburger-btn"
                title="メニューを開く"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
              </button>
              {/* ファイル名 / タイトル */}

                    onChange={(e) => setNewFilename(e.target.value)}

                    placeholder="ファイル名.md"
                    id="filename-input"
                  />
                ) : selectedArticle ? (

                    {isEditingTitle ? (
                      <div className="flex items-center gap-1.5 flex-1 min-w-0">

                          ref={titleInputRef}
                          type="text"
                          value={editedTitle}
                          onChange={(e) => setEditedTitle(e.target.value)}
                          onBlur={commitTitleEdit}

                        </button>

                          </p>

                        <button
                          onClick={() => { setEditedTitle(selectedArticle.h1Title || (articleH1Cache && articleH1Cache[selectedArticle.id]) || getArticleFilenameTitle(selectedArticle.name)); setIsEditingTitle(true); }}

                          id="edit-title-btn"

                        </button>
                      </div>
                    )}
                  </div>
                ) : (
                  <p className="text-sm text-slate-400">記事を選択してください</p>
                )}
              </div>

              {/* アクションボタン群 */}
              <div className="flex items-center gap-2 flex-shrink-0">
                {/* Amazon検索フォーム */}
                <form
                  className="hidden md:flex items-center gap-1"

                    e.preventDefault();
                    const q = e.currentTarget.querySelector('input').value.trim();
                    if (q) window.open(`https://www.amazon.co.jp/s?k=${encodeURIComponent(q)}`, '_blank');
                  }}
                >
                  <input
                    type="text"
                    placeholder="Amazon検索..."
                    className="border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-600 focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-100"

                  >
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="11" cy="11" r="8" /><path d="M21 21l-4.35-4.35" /></svg>
                    <span className="hidden lg:inline">Amazon</span>
                  </button>

                {/* 選択モード解除ボタン */}

                  >
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12" /></svg>
                    <span className="hidden lg:inline">解除</span>
                  </button>

                {/* note公開投稿ボタン */}

                      : 'bg-[#7C4DFF] text-white hover:bg-[#651FFF] shadow-purple-200'
                    }`}
                  title={selectedPostTargets.length > 1 ? `${selectedPostTargets.length}件をnoteに公開投稿` : 'この記事をnoteに公開投稿'}
                  id="note-post-btn"

                    <svg className="animate-spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 11-6.219-8.56" /></svg>
                  ) : (
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M12 5v14M5 12h14" /><path d="M17 7l-5-5-5 5" /></svg>
                  )}
                  <span className="hidden sm:inline">
                    {selectedPostTargets.length > 1 ? `公開投稿(${selectedPostTargets.length})` : '公開投稿'}
                  </span>

                <button

                      ? 'border-slate-200 text-slate-400 cursor-not-allowed'
                      : (!selectedArticle && !(selectMode && selectedIds.size > 0))
                        ? 'border-slate-200 text-slate-300 cursor-not-allowed'
                        : 'border-[#7C4DFF] text-[#7C4DFF] hover:bg-purple-50'
                    }`}
                  title={selectMode && selectedIds.size > 0 ? `${selectedIds.size}件をnoteに下書き保存` : 'この記事をnoteに下書き保存'}
                  id="note-draft-btn"
                >
                  {noteDraftRunning ? (
                    <svg className="animate-spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 11-6.219-8.56" /></svg>
                  ) : (
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
                  )}
                  <span className="hidden sm:inline">
                    {noteDraftRunning ? '投稿中...' : selectMode && selectedIds.size > 0 ? `下書き(${selectedIds.size})` : '下書き'}
                  </span>
                </button>
                {/* パイプライン実行ボタン (保存の左隣) */}
                <button

                    }`}
                  id="trigger-pipeline-btn"
                  title="パイプライン実行"
                >
