                    <svg className="animate-spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 11-6.219-8.56" /></svg>
                  ) : (
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z" /></svg>
                  )}
                  <span className="hidden sm:inline">パイプライン</span>
                </button>

                {/* 保存ボタン */}
                <button
                  onClick={handleSave}
                  disabled={saving || (!selectedArticle && !isNewArticle)}
                  className={`flex items-center gap-1.5 font-bold rounded-lg px-4 py-2 text-sm transition-all shadow-sm ${saving
                      ? 'bg-slate-300 text-slate-500 cursor-not-allowed'
                      : 'bg-[#7C4DFF] text-white hover:bg-[#651FFF] shadow-purple-200'
                    }`}
                  id="save-btn"
                >
                  {saving ? (
                    <>
                      <svg className="animate-spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 11-6.219-8.56" /></svg>
                      保存中...
                    </>
                  ) : (
                    <>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" /><path d="M17 21v-8H7v8M7 3v5h8" /></svg>
                      <span className="hidden sm:inline">保存</span>
                    </>
                  )}
                </button>

                {/* リロード */}
                <button
                  onClick={loadArticles}
                  className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors"
                  title="記事一覧を更新" id="reload-btn"
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 4v6h6M23 20v-6h-6" /><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" /></svg>
                </button>
              </div>
            </header>

            {/* モバイル用タブ */}
            <div className="lg:hidden flex border-b border-slate-200 bg-white shrink-0">
              <button onClick={() => setMobileTab('editor')} className={`flex-1 py-2.5 text-sm text-center transition-colors ${mobileTab === 'editor' ? 'tab-active' : 'text-slate-400'}`}>エディタ</button>
              <button onClick={() => setMobileTab('preview')} className={`flex-1 py-2.5 text-sm text-center transition-colors ${mobileTab === 'preview' ? 'tab-active' : 'text-slate-400'}`}>プレビュー</button>
            </div>

            {/* エディタ + プレビュー */}
            {contentLoading ? (
              <div className="flex-1 flex items-center justify-center">
                <div className="text-center">
                  <div className="skeleton w-10 h-10 rounded-full mx-auto mb-3" />
                  <p className="text-slate-400 text-sm">読み込み中...</p>
                </div>
              </div>
            ) : !selectedArticle && !isNewArticle ? (
              /* 空の状態 */
              <div className="flex-1 flex items-center justify-center animate-fade-in">
                <div className="text-center px-8">
                  <div className="w-20 h-20 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-[#7C4DFF] to-[#651FFF] flex items-center justify-center shadow-lg shadow-purple-200">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" /></svg>
                  </div>
                  <h2 className="text-xl font-bold text-slate-800 mb-2">Vibe Blog Engine</h2>
                  <p className="text-slate-400 text-sm max-w-xs leading-relaxed">サイドバーから記事を選択するか、<br />「新規作成」で始めましょう。</p>
                  <button
                    onClick={handleNewArticle}
                    className="mt-5 flex items-center justify-center gap-2 bg-[#7C4DFF] text-white font-bold rounded-lg px-6 py-3 hover:bg-[#651FFF] transition-colors text-sm mx-auto"
                  >
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14" /></svg>
                    新規作成
                  </button>
                </div>
              </div>
            ) : (
              /* エディタ + プレビュー（リサイズ対応） */
              <div ref={editorAreaRef} className="flex-1 flex overflow-hidden">
                {/* エディタ */}
                <div
                  className={`flex flex-col border-r border-slate-200 ${mobileTab === 'preview' ? 'hidden lg:flex' : 'flex'}`}
                  style={isDesktop ? { width: `${editorRatio * 100}%`, flexShrink: 0 } : { width: '100%' }}
                >
                  <div className="px-4 py-1.5 bg-slate-50 border-b border-slate-100 text-xs text-slate-400 font-medium flex items-center gap-2 shrink-0">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>
                    MARKDOWN
                    {/* YouTube元動画リンク */}
                    {selectedArticle && (youtubeUrl ? (
                      /* URL あり: 紫の動画アイコン */
                      <a
                        href={youtubeUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex items-center rounded p-0.5 transition-colors hover:bg-purple-50 text-purple-400 hover:text-purple-600"
                        title="元のYouTube動画を開く"
                        onContextMenu={(e) => { e.preventDefault(); setYtInputVal(youtubeUrl); setYtInputOpen(true); }}
                      >
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <polygon points="23 7 16 12 23 17 23 7" />
                          <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                        </svg>
                      </a>
                    ) : ytInputOpen ? (
                      /* URL 入力フォーム（インライン） */
                      <span className="flex items-center gap-1">
                        <input
                          autoFocus
                          type="text"
                          value={ytInputVal}
                          onChange={e => setYtInputVal(e.target.value)}
                          onKeyDown={e => { if (e.key === 'Enter') saveYtUrl(); if (e.key === 'Escape') { setYtInputOpen(false); setYtInputVal(''); } }}
                          placeholder="YouTube URL を貼り付け..."
                          className="border border-purple-300 rounded px-1.5 py-0.5 text-xs text-slate-700 focus:outline-none focus:border-purple-500"
                          style={{ width: '200px' }}
                        />
                        <button onClick={saveYtUrl} className="text-purple-500 hover:text-purple-700 font-bold text-xs px-1">✓</button>
                        <button onClick={() => { setYtInputOpen(false); setYtInputVal(''); }} className="text-slate-400 hover:text-slate-600 text-xs px-1">✕</button>
                      </span>
                    ) : (
                      /* URL なし: ✙ ボタンでリンク手動登録 */
                      <button
                        onClick={() => setYtInputOpen(true)}
                        className="flex items-center rounded p-0.5 transition-colors hover:bg-purple-50 text-slate-300 hover:text-purple-400"
                        title="YouTube動画URLを登録"
                      >
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <polygon points="23 7 16 12 23 17 23 7" />
                          <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                        </svg>
                        <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" style={{ marginLeft: '1px', marginTop: '-4px' }}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
                      </button>
                    ))}
                    {/* note下書き保存先URL */}
                    {selectedArticle && noteDraftUrls[selectedArticle.id] && (
                      <a
                        href={noteDraftUrls[selectedArticle.id]}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex items-center gap-1 rounded px-1.5 py-0.5 transition-colors hover:bg-purple-100 text-purple-500 hover:text-purple-700"
                        title="noteで開く"
                      >
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6" /></svg>
                        保存先URL
                      </a>
                    )}
                    {autoSaveStatus === 'pending' && <span className="text-slate-300 text-xs" title="自動保存待機中...">●</span>}
                    {autoSaveStatus === 'saved' && <span className="text-green-400 text-xs" title="自動保存完了">✓</span>}
                    <div className="ml-auto flex items-center gap-2">
                      <button
                        onClick={openFindReplacePanel}
                        className="lg:hidden rounded px-1.5 py-0.5 text-[#7C4DFF] hover:bg-purple-50 hover:text-[#651FFF] transition-colors"
                        title="検索と置換を開く"
                      >
                        置換
                      </button>
                      <span>{content.length.toLocaleString()} 文字</span>
                    </div>
                    {/* Amazonアフィリエイトリンク一括削除ボタン */}
                    <button
                      onClick={() => {
                        // amazon.co.jp/dp/{ASIN}/ref=nosim?tag=hiroshit-22 形式の行を削除
                        const AMAZON_RE = /^https:\/\/www\.amazon\.co\.jp\/dp\/[A-Z0-9]{10}\/ref=nosim\?tag=hiroshit-22$/;
                        const lines = content.split('\n');
                        // 削除対象行のインデックスを収集
                        const removeIdx = new Set(
                          lines.reduce((acc, ln, i) => {
                            if (AMAZON_RE.test(ln.trim())) acc.push(i);
                            return acc;
                          }, [])
                        );
                        if (removeIdx.size === 0) { showToast('削除対象のAmazonリンクが見つかりません', 'error'); return; }
                        // 該当行とその前後の空行を除去
                        const filtered = lines.filter((ln, i) => {
                          if (removeIdx.has(i)) return false;
                          // 前後がリンク行だった空行も除去（連続空行を1つに正規化）
                          const prevIsLink = removeIdx.has(i - 1);
                          const nextIsLink = removeIdx.has(i + 1);
                          if ((prevIsLink || nextIsLink) && ln.trim() === '') return false;
                          return true;
                        });
                        // 連続する空行を最大2行に正規化
                        const normalized = [];
                        let blankCount = 0;
                        for (const ln of filtered) {
                          if (ln.trim() === '') { blankCount++; if (blankCount <= 2) normalized.push(ln); }
                          else { blankCount = 0; normalized.push(ln); }
                        }
                        setContent(normalized.join('\n'));
                        showToast(`Amazonアフィリエイトリンクを${removeIdx.size}件削除しました`, 'success');
                      }}
                      className="flex items-center gap-1 rounded px-1.5 py-0.5 transition-colors hover:text-red-500 hover:bg-red-50"
                      title="挿入済みAmazonアフィリエイトリンクを全て削除"
                    >
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12" /></svg>
                    </button>
                    {/* リンク挿入ボタン: クリップボード内容を偶数番目H2（2,4,6...）の直前に挿入 */}
                    <button
                      onClick={async () => {
                        try {
                          const clip = await navigator.clipboard.readText();
                          if (!clip.trim()) { showToast('クリップボードが空です', 'error'); return; }
                          const lines = content.split('\n');
                          // H2行のインデックスを収集（1-indexed count）
                          const h2Indices = [];
                          lines.forEach((ln, i) => { if (/^## /.test(ln)) h2Indices.push(i); });
                          if (h2Indices.length < 2) { showToast('H2見出しが2つ以上必要です', 'error'); return; }
                          // 偶数番目（2,4,6...→0-indexed: 1,3,5...）の直前に挿入（逆順で行番号ズレ防止）
                          const targets = h2Indices.filter((_, idx) => idx % 2 === 1).reverse();
                          const insertBlock = `\n${clip.trim()}\n`;
                          let result = [...lines];
                          for (const lineIdx of targets) {
                            result = [...result.slice(0, lineIdx), '', clip.trim(), '', ...result.slice(lineIdx)];
                          }
                          setContent(result.join('\n'));
                          showToast(`${targets.length}箇所にリンクを挿入しました`, 'success');
                        } catch { showToast('クリップボードの読み取りに失敗しました', 'error'); }
                      }}
                      className="flex items-center gap-1 rounded px-1.5 py-0.5 transition-colors hover:text-purple-600 hover:bg-purple-50"
                      title="クリップボードの内容を偶数番目H2（2,4,6...）の直前に挿入"
                    >
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" /></svg>
                    </button>
                    <button
                      onClick={async () => {
                        try { await navigator.clipboard.writeText(content); setCopied(true); setTimeout(() => setCopied(false), 2000); }
                        catch { showToast('コピーに失敗しました', 'error'); }
                      }}
                      className={`flex items-center gap-1 rounded px-1.5 py-0.5 transition-colors ${copied ? 'text-green-500' : 'hover:text-slate-600 hover:bg-slate-200'}`}
                      title="全文をコピー"
                    >
                      {copied
                        ? <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 6L9 17l-5-5" /></svg>
                        : <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" /></svg>
                      }
                    </button>
                  </div>
                  <textarea
                    key={editorInstanceKey}
                    ref={textareaRef}
                    onScroll={handleEditorScroll}
                    onKeyDown={handleKeyDown}
                    value={content}
                    onChange={(e) => setContent(e.target.value)}
                    className="editor-textarea flex-1 w-full p-4 bg-white text-slate-700 focus:outline-none"
                    placeholder="Markdownを入力..."
                    spellCheck={false}
                    id="editor-textarea"
                  />
                </div>

                {/* リサイズハンドル（デスクトップのみ） */}
                <div
                  className={`resize-handle hidden lg:block`}
                  onMouseDown={onEditorResizeStart}
                />

                {/* プレビュー */}
                <div
                  className={`flex flex-col ${mobileTab === 'editor' ? 'hidden lg:flex' : 'flex'}`}
                  style={{ flex: 1, minWidth: 0 }}
                >
                  <div className="px-4 py-1.5 bg-slate-50 border-b border-slate-100 text-xs text-slate-400 font-medium flex items-center gap-2 shrink-0">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
                    プレビュー
                    <button
                      onClick={refreshOgp}
                      className="flex items-center gap-0.5 rounded px-1 py-0.5 hover:bg-purple-100 hover:text-purple-600 transition-colors"
                      title="OGPリンクを再読み込み"
                    >
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M1 4v6h6M23 20v-6h-6" /><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" /></svg>
                      OGP更新
                    </button>
                  </div>
                  <div
                    ref={previewRef}
                    onScroll={handlePreviewScroll}
                    onDoubleClick={handlePreviewDoubleClick}
                    className="flex-1 overflow-y-auto p-6 markdown-preview animate-fade-in"
                    dangerouslySetInnerHTML={{ __html: renderedHTML }}
                    id="preview-area"
                  />
                </div>
              </div>
            )}
          </main>

          {/* 検索と置換パネル（fixed） */}
          {showFindReplace && (
            <div style={{ position: 'fixed', top: isDesktop ? '60px' : '106px', right: isDesktop ? '16px' : '12px', left: isDesktop ? 'auto' : '12px', zIndex: 1000, width: isDesktop ? '340px' : 'auto' }}
              className="bg-white border border-slate-300 rounded-lg shadow-xl text-sm"
            >
              <div className="flex items-center gap-1 px-2 py-1.5 border-b border-slate-100">
                <svg className="text-slate-400 shrink-0" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><path d="M21 21l-4.35-4.35" /></svg>
                <input ref={findInputRef} value={findText}
                  onChange={e => { setFindText(e.target.value); setMatchIndex(0); }}
                  onKeyDown={e => {
                    if (e.key === 'Enter') { e.preventDefault(); e.shiftKey ? goPrevMatch() : goNextMatch(); }
                    if (e.key === 'Escape') { setShowFindReplace(false); textareaRef.current?.focus(); }
                  }}
                  placeholder="検索"
                  className="flex-1 border border-slate-200 rounded px-1.5 py-0.5 text-slate-700 focus:outline-none focus:border-[#7C4DFF] text-xs"
                  style={{ minWidth: 0 }}
                />
                <span className="text-slate-400 text-xs whitespace-nowrap shrink-0 min-w-[2.5rem] text-right">
                  {findText ? (findMatches.length > 0 ? `${safeMatchIndex + 1}/${findMatches.length}` : '0件') : ''}
                </span>
                <button onClick={goPrevMatch} disabled={findMatches.length === 0} className="p-1 rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30" title="前へ">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 15l-6-6-6 6" /></svg>
                </button>
                <button onClick={goNextMatch} disabled={findMatches.length === 0} className="p-1 rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30" title="次へ">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M6 9l6 6 6-6" /></svg>
                </button>
                <button onClick={() => { setShowFindReplace(false); textareaRef.current?.focus(); }} className="p-1 rounded hover:bg-slate-100 text-slate-500" title="閉じる">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12" /></svg>
                </button>
              </div>
              <div className="flex items-center gap-1 px-2 py-1.5">
                <svg className="text-slate-400 shrink-0" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 7h16M4 12h10M4 17h13" /><path d="M20 14l-3 3 3 3" /></svg>
                <input ref={replaceInputRef} value={replaceText}
                  onChange={e => setReplaceText(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === 'Enter') { e.preventDefault(); handleReplaceOne(); }
                    if (e.key === 'Escape') { setShowFindReplace(false); textareaRef.current?.focus(); }
                  }}
                  placeholder="置換"
                  className="flex-1 border border-slate-200 rounded px-1.5 py-0.5 text-slate-700 focus:outline-none focus:border-[#7C4DFF] text-xs"
                  style={{ minWidth: 0 }}
                />
                <button onClick={handleReplaceOne} disabled={findMatches.length === 0} className="flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-600 disabled:opacity-30 whitespace-nowrap" title="1件置換">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M7 16V4m0 0L3 8m4-4l4 4" /><path d="M17 8v12m0 0l4-4m-4 4l-4-4" /></svg>1件
                </button>
                <button onClick={handleReplaceAll} disabled={findMatches.length === 0} className="flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-600 disabled:opacity-30 whitespace-nowrap" title="全て置換">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 16V4m0 0L1 7m3-3l3 3" /><path d="M10 16V4m0 0L7 7m3-3l3 3" /><path d="M20 8v12m0 0l-3-3m3 3l3-3" /></svg>全て
                </button>
              </div>
            </div>
          )}

          {/* アフィリンクモーダル */}
          <AffiliateLinkModal isOpen={affModalOpen} onClose={() => setAffModalOpen(false)} showToast={showToast} />

          {/* トースト */}
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    }

    // === マウント ===
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
