            </div>

            {/* スライドするコンテンツ（マウスD&Dも維持） */}
            <div
              className={`swipe-inner flex items-center gap-1${swipedId === article.id ? ' swiped' : ''}${isTouchDragging ? ' touch-dragging-item' : ''}`}
              draggable
              onDragStart={(e) => {
                dragArticleRef.current = getDragTargets(article);
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', article.id);
              }}
              onDragEnd={() => { dragArticleRef.current = null; setDragOver(null); }}
            >
              {selectMode && (
                <button
                  onClick={(e) => { e.stopPropagation(); onToggleSelect(article.id); }}
                  className="flex-shrink-0 w-5 h-5 flex items-center justify-center rounded border transition-colors"
                  style={{ borderColor: isChecked ? '#7C4DFF' : '#cbd5e1', background: isChecked ? '#7C4DFF' : 'white' }}
                >
                  {isChecked && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5" /></svg>}
                </button>
              )}
              <button
                onClick={handleClick}
                onContextMenu={(e) => handleContextMenu(e, article)}
                className={`flex-1 min-w-0 text-left rounded-md px-2 py-2 article-item ${isActive && !selectMode && !highlighted ? 'active' : ''} ${highlighted ? 'bg-purple-50' : ''}`}
                id={`article-item-${article.id}`}
                style={{ cursor: 'grab', outline: isMultiSelected ? '1.5px solid #7C4DFF' : undefined, outlineOffset: '-1px' }}
              >
                <div className={`text-xs font-medium truncate ${isActive && !selectMode && !highlighted ? 'text-white' : highlighted ? 'text-purple-700' : 'text-slate-700'}`}>
                  <svg
                    className={`inline mr-1 mb-0.5 ${isNotePostScheduled ? '' : 'opacity-60'}`}
                    width="11"
                    height="11"
                    viewBox="0 0 24 24"
                    fill={isNotePostScheduled ? '#7C4DFF' : 'none'}
                    stroke={isNotePostScheduled ? '#7C4DFF' : 'currentColor'}
                    strokeWidth="2"
                    title={isNotePostScheduled ? '予約投稿済み' : undefined}
                  >
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6" />
                  </svg>
                  {searchQuery ? <HighlightedTitle text={displayName} keyword={searchQuery} /> : displayName}
                </div>
                <div className={`text-xs mt-0.5 article-date flex items-center gap-1 ${isActive && !selectMode && !highlighted ? 'text-purple-200' : 'text-slate-400'}`}>
                  <span className="min-w-0 truncate">{date}{scheduledPostLabel ? ` · ${scheduledPostLabel}` : ''}</span>
                  <span
                    className="ml-auto flex-shrink-0 rounded px-1.5 py-0.5 text-[10px] font-bold leading-none"
                    title={sourceTagTitle}
                    style={hasMissedNotePost
                      ? { background: '#fee2e2', color: '#b91c1c' }
                      : sourceType === 'amazon'
                      ? { background: '#ffedd5', color: '#c2410c' }
                      : { background: '#f1f5f9', color: '#64748b' }}
                  >
                    {sourceLabel}
                  </span>
                  {modelTags.map((tag) => (
                    <span
                      key={tag}
                      className="flex-shrink-0 rounded px-1.5 py-0.5 text-[10px] font-bold leading-none"
                      style={{ background: '#e5e7eb', color: '#6b7280' }}
                    >
                      {tag}
                    </span>
                  ))}
                </div>
              </button>
            </div>
          </div>
        );
      };

      // フォルダノードを再帰的にレンダリング（多段階対応）
      const renderFolderNode = (node, folderName, folderPath, depth = 0) => {
        // 非表示フォルダはスキップ
        if (hiddenFolders && hiddenFolders.has(folderPath)) return null;

        const isOpen = openFolders[folderPath];
        const isFolderSelected = selectedFolderPaths.has(folderPath);
        const isDragTarget = dragOver === folderPath;
        const isFolderLoading = !!folderLoading[folderPath];
        const folderSetting = getFolderLoadSetting(folderPath);
        const total = countArticles(node);
        const loadedTotal = countLoadedArticles(node);
        const childCount = node._meta && Number.isFinite(node._meta.childCount) ? node._meta.childCount : 0;
        const folderCountLabel = isFolderLoading
          ? '...'
          : folderSetting.includeAll && childCount > loadedTotal
            ? `${loadedTotal}/${childCount}`
            : total;
        const subKeys = Object.keys(node.subfolders).sort((a, b) => b.localeCompare(a));
        const indent = depth * 12;

        return (
          <div key={folderPath} className="mb-0.5">
            {/* フォルダヘッダー（ドロップ受付） */}
            <button
              data-folder-path={folderPath}
              onClick={(e) => {
                if (folderSelectMode) {
                  e.preventDefault();
                  toggleFolderSelection(folderPath);
                  return;
                }
                if (e.ctrlKey || e.metaKey) {
                  e.preventDefault();
                  beginFolderSelection(folderPath);
                  return;
                }
                toggleFolder(folderPath, node._meta);
              }}
              onContextMenu={(e) => handleFolderContextMenu(e, folderPath)}
              onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setDragOver(folderPath); }}
              onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
              onDrop={(e) => {
                e.preventDefault();
                setDragOver(null);
                const dragged = dragArticleRef.current;
                if (!dragged) return;
                // 複数選択ドラッグ（配列）か単一か
                const targets = Array.isArray(dragged) ? dragged : [dragged];
                const toMove = targets.filter(a => a.path !== folderPath);
                if (toMove.length === 0) return;
                onMoveArticle && onMoveArticle(toMove, folderPath);
              }}
              className={`w-full flex items-center gap-1.5 px-2 py-1.5 rounded-md folder-item text-left text-xs font-semibold text-slate-500 hover:text-slate-700${touchDragOver === folderPath ? ' touch-drag-folder-target' : ''}`}
              style={{
                paddingLeft: `${8 + indent}px`,
                background: isFolderSelected ? 'rgba(124,77,255,0.10)' : isDragTarget ? 'rgba(124,77,255,0.1)' : undefined,
                outline: isFolderSelected ? '1.5px solid #7C4DFF' : isDragTarget ? '2px dashed #7C4DFF' : undefined,
                outlineOffset: '-2px',
              }}
            >
              {folderSelectMode && (
                <span
                  style={{ width: '16px', height: '16px', borderRadius: '4px', border: `1.5px solid ${isFolderSelected ? '#7C4DFF' : '#cbd5e1'}`, background: isFolderSelected ? '#7C4DFF' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}
                >
                  {isFolderSelected && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5" /></svg>}
                </span>
              )}
              <svg
                width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                style={{ transform: isOpen ? 'rotate(90deg)' : 'rotate(0deg)', transition: 'transform 0.15s', flexShrink: 0 }}
              >
                <path d="M9 18l6-6-6-6" />
              </svg>
              <svg width="13" height="13" viewBox="0 0 24 24" fill={isOpen ? '#7C4DFF' : 'none'} stroke={isOpen ? '#7C4DFF' : 'currentColor'} strokeWidth="2" style={{ flexShrink: 0 }}>
                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z" />
              </svg>
              <span className="truncate" style={{ color: isOpen ? '#7C4DFF' : undefined }}>{folderName}</span>
              {folderSetting.includeAll && (
                <span className="rounded bg-purple-50 px-1 text-[10px] font-bold text-[#7C4DFF]">全</span>
              )}
              <span className="ml-auto bg-slate-100 text-slate-400 text-xs rounded-full px-1.5 py-0.5 leading-none flex-shrink-0">{folderCountLabel}</span>
            </button>

            {isOpen && (
              <div style={{ marginLeft: `${4 + indent}px`, paddingLeft: '8px', borderLeft: '1px solid #f1f5f9' }}>
                {isFolderLoading && <div className="skeleton h-8 w-full my-1" />}
                {/* サブフォルダ（再帰） */}
                {subKeys.map(k => renderFolderNode(node.subfolders[k], k, folderPath ? `${folderPath}/${k}` : k, depth + 1))}
                {/* このフォルダ内の記事 */}
                {node._articles.slice(0, folderSetting.includeAll ? folderSetting.limit : visibleArticleLimit).map(a => renderArticle(a))}
              </div>
            )}
          </div>
        );
      };

      const rootSubKeys = Object.keys(rootNode.subfolders).sort((a, b) => b.localeCompare(a));
      const confirmDeleteTargets = Array.isArray(confirmDelete) ? confirmDelete : confirmDelete ? [confirmDelete] : [];
      const confirmDeleteCount = confirmDeleteTargets.length;
      const confirmDeleteLabel = confirmDeleteCount > 1
        ? `${confirmDeleteCount}件の記事`
        : `「${getArticleFilenameTitle(confirmDeleteTargets[0]?.name)}」`;

      return (
        <>
          <div
            ref={sbTouchContainerRef}
            className="px-2 pb-2"
            onTouchStart={(e) => { if (swipedId && !e.target.closest('.swipe-row')) setSwipedId(null); }}
            onContextMenu={(e) => { if (e.target === e.currentTarget) handleRootContextMenu(e); }}
          >
            {folderSelectMode && !flatMode && (
              <div className="mb-2 flex items-center gap-2 rounded-lg border border-purple-100 bg-purple-50 px-2 py-1.5 text-[11px] font-bold text-purple-700">
                <span className="min-w-0 flex-1">フォルダ {selectedFolderPaths.size}件選択</span>
                <button
                  onClick={clearFolderSelection}
                  className="rounded border border-purple-200 bg-white px-2 py-1 text-[10px] text-purple-700"
                >終了</button>
              </div>
            )}
            {flatMode ? (
              <>
                <div className="px-2 pb-2 text-[11px] font-bold text-slate-400">{articles.length}件</div>
                {articles.slice(0, visibleArticleLimit).map(a => renderArticle(a))}
              </>
            ) : (
              <>
                {/* ルート直下のフォルダを再帰レンダリング */}
                {rootSubKeys.map(k => renderFolderNode(rootNode.subfolders[k], k, k, 0))}

                {/* ルート直下の記事（フォルダなし） */}
                {rootNode._articles.length > 0 && (
                  <div
                    data-folder-path=""
                    onContextMenu={handleRootContextMenu}
                    onDragOver={(e) => { e.preventDefault(); setDragOver(''); }}
                    onDragLeave={() => setDragOver(null)}
                    onDrop={(e) => {
                      e.preventDefault();
                      setDragOver(null);
                      const dragged = dragArticleRef.current;
                      if (!dragged) return;
                      const targets = Array.isArray(dragged) ? dragged : [dragged];
                      const toMove = targets.filter(a => a.path !== '');
                      if (toMove.length === 0) return;
                      onMoveArticle && onMoveArticle(toMove, '');
                    }}
                    className={touchDragOver === '' ? 'touch-drag-folder-target' : ''}
                    style={{ borderRadius: '6px', outline: dragOver === '' ? '2px dashed #7C4DFF' : undefined, outlineOffset: '-2px' }}
                  >
                    <div className="px-2 py-1 text-xs text-slate-400 font-semibold">その他</div>
                    {rootNode._articles.map(a => renderArticle(a))}
                  </div>
                )}
              </>
            )}
          </div>

          {/* 長押しドラッグゴースト */}
          {dragGhostInfo && (
            <div className="touch-drag-ghost" style={{ left: dragGhostInfo.x, top: dragGhostInfo.y }}>
              {dragGhostInfo.name}
            </div>
          )}

          {/* ── 右クリックコンテキストメニュー ── */}
          {ctxMenu.visible && (
            <div
              onClick={e => e.stopPropagation()}
              style={{ position: 'fixed', top: ctxMenu.y, left: ctxMenu.x, zIndex: 9999, background: 'white', borderRadius: '8px', boxShadow: '0 4px 24px rgba(0,0,0,0.15)', border: '1px solid #e2e8f0', minWidth: '190px', padding: '4px 0', overflow: 'hidden' }}
            >
              {rootLoadControls}
              <div style={{ height: '1px', background: '#e2e8f0', margin: '4px 0' }} />
              <button
                onClick={() => { onEnterSelectMode(ctxMenu.article); setCtxMenu(m => ({ ...m, visible: false })); }}
                onMouseEnter={e => e.currentTarget.style.background = '#f5f3ff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#7C4DFF', textAlign: 'left', fontWeight: 600 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="3" y="5" width="4" height="4" rx="1" /><path d="M10 7h11M10 12h11M10 17h11" /><rect x="3" y="10" width="4" height="4" rx="1" /><rect x="3" y="15" width="4" height="4" rx="1" /></svg>
                選択
              </button>
              <button
                onClick={() => {
                  onCreateAccessory && onCreateAccessory(getContextTargetArticles(ctxMenu.article));
                  setCtxMenu(m => ({ ...m, visible: false }));
                }}
                onMouseEnter={e => e.currentTarget.style.background = '#ecfeff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#0891b2', textAlign: 'left', fontWeight: 600 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3"><path d="M12 2v20M2 12h20" /><circle cx="12" cy="12" r="9" /></svg>
                周辺機器記事作成{getContextTargetIds(ctxMenu.article).length > 1 ? `（${getContextTargetIds(ctxMenu.article).length}件）` : ''}
              </button>
              <button
                onClick={() => {
                  onOpenAccessoryReport && onOpenAccessoryReport({
                    articleId: ctxMenu.article.id,
                    folderPath: ctxMenu.article.path || '',
                  });
                  setCtxMenu(m => ({ ...m, visible: false }));
                }}
                onMouseEnter={e => e.currentTarget.style.background = '#ecfeff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#0891b2', textAlign: 'left', fontWeight: 600 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M4 19V9M10 19V5M16 19v-7M22 19V2" /></svg>
                周辺機器の生成結果
              </button>
              <button
                onClick={() => {
                  onCreateTitleVariant && onCreateTitleVariant(ctxMenu.article);
                  setCtxMenu(m => ({ ...m, visible: false }));
                }}
                onMouseEnter={e => e.currentTarget.style.background = '#f5f3ff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#6d28d9', textAlign: 'left', fontWeight: 600 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M4 7h16M4 12h10M4 17h8" /><path d="M17 14l3 3-3 3M20 17h-6" /></svg>
                タイトル変更
              </button>
              <button
                onClick={() => {
                  onSchedulePost && onSchedulePost(getContextTargetIds(ctxMenu.article));
                  setCtxMenu(m => ({ ...m, visible: false }));
                }}
                onMouseEnter={e => e.currentTarget.style.background = '#f5f3ff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#7C4DFF', textAlign: 'left', fontWeight: 600 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" /></svg>
                予約投稿{getContextTargetIds(ctxMenu.article).length > 1 ? `（${getContextTargetIds(ctxMenu.article).length}件）` : ''}
              </button>
              {getContextTargetIds(ctxMenu.article).length > 1 && (
                <button
                  onClick={() => {
                    onBulkReplace && onBulkReplace(getContextTargetIds(ctxMenu.article));
                    setCtxMenu(m => ({ ...m, visible: false }));
                  }}
                  onMouseEnter={e => e.currentTarget.style.background = '#f5f3ff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                  style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#7C4DFF', textAlign: 'left', fontWeight: 600 }}
                >
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3"><path d="M4 7h16M4 12h10M4 17h13" /><path d="M20 14l-3 3 3 3" /></svg>
                  一括置換（{getContextTargetIds(ctxMenu.article).length}件）
                </button>
              )}
              <div style={{ height: '1px', background: '#e2e8f0', margin: '4px 0' }} />
              <button
                onClick={() => { onDuplicateArticle(getContextTargetArticles(ctxMenu.article)); setCtxMenu(m => ({ ...m, visible: false })); }}
                onMouseEnter={e => e.currentTarget.style.background = '#f1f5f9'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#334155', textAlign: 'left' }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" /></svg>
                複製{getContextTargetIds(ctxMenu.article).length > 1 ? `（${getContextTargetIds(ctxMenu.article).length}件）` : ''}
              </button>
              <button
                onClick={() => { setConfirmDelete(getContextTargetArticles(ctxMenu.article)); setCtxMenu(m => ({ ...m, visible: false })); }}
                onMouseEnter={e => e.currentTarget.style.background = '#fff1f2'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#ef4444', textAlign: 'left' }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14H6L5 6" /><path d="M10 11v6M14 11v6" /><path d="M9 6V4h6v2" /></svg>
                削除{getContextTargetIds(ctxMenu.article).length > 1 ? `（${getContextTargetIds(ctxMenu.article).length}件）` : ''}
              </button>
              <div style={{ height: '1px', background: '#e2e8f0', margin: '4px 0' }} />
              <button
                onClick={() => {
                  window.open(ctxMenu.article.webUrl, '_blank');
                  setCtxMenu(m => ({ ...m, visible: false }));
                }}
                onMouseEnter={e => e.currentTarget.style.background = '#f1f5f9'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#334155', textAlign: 'left' }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></svg>
                OneDriveで開く
              </button>
              <button
                hidden
                onClick={() => {
                  const a = ctxMenu.article;
                  if (a.webUrl) {
                    window.open(a.webUrl, '_blank');
                  }
                  setCtxMenu(m => ({ ...m, visible: false }));
                }}
                onMouseEnter={e => e.currentTarget.style.background = '#f1f5f9'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#334155', textAlign: 'left' }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
                エクスプローラーで表示
              </button>
            </div>
          )}

          {/* ── OneDrive直下の空欄右クリックメニュー ── */}
          {rootCtxMenu.visible && (
            <div
              onClick={e => e.stopPropagation()}
              style={{ position: 'fixed', top: rootCtxMenu.y, left: rootCtxMenu.x, zIndex: 9999, background: 'white', borderRadius: '8px', boxShadow: '0 4px 24px rgba(0,0,0,0.15)', border: '1px solid #e2e8f0', minWidth: '230px', padding: '4px 0' }}
            >
              {rootLoadControls}
            </div>
          )}

          {/* ── フォルダ右クリックメニュー ── */}
          {folderCtxMenu.visible && (
            <div
              onClick={e => e.stopPropagation()}
              style={{ position: 'fixed', top: folderCtxMenu.y, left: folderCtxMenu.x, zIndex: 9999, background: 'white', borderRadius: '8px', boxShadow: '0 4px 24px rgba(0,0,0,0.15)', border: '1px solid #e2e8f0', minWidth: '220px', maxHeight: 'calc(100vh - 16px)', overflowY: 'auto', padding: '4px 0' }}
            >
              {(() => {
                const path = folderCtxMenu.path;
                const meta = folderMeta[path] || {};
                const setting = getFolderLoadSetting(path);
                const nextLimit = setting.limit + FOLDER_LOAD_STEP;
                const folderTargets = getFolderContextTargets(path);
                return (
                  <>
                    <div style={{ padding: '8px 14px 6px', borderBottom: '1px solid #f1f5f9' }}>
                      <div style={{ fontSize: '12px', fontWeight: 700, color: '#334155', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{path || 'ルート'}</div>
                      <div style={{ marginTop: '3px', fontSize: '11px', color: '#64748b' }}>
                        {setting.includeAll
                          ? `全期間 ON / ${setting.limit}件まで${setting.inherited ? `（${setting.inheritedFrom}から継承）` : ''}`
                          : `通常読み込み${setting.inherited ? `（${setting.inheritedFrom}から継承）` : ''}`}
                      </div>
                    </div>
                    <button
                      onClick={() => {
                        beginFolderSelection(path);
                        setFolderCtxMenu(m => ({ ...m, visible: false }));
                      }}
                      onMouseEnter={e => e.currentTarget.style.background = '#f5f3ff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                      style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#7C4DFF', textAlign: 'left', fontWeight: 600 }}
                    >
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="3" y="5" width="4" height="4" rx="1" /><path d="M10 7h11M10 12h11M10 17h11" /><rect x="3" y="10" width="4" height="4" rx="1" /><rect x="3" y="15" width="4" height="4" rx="1" /></svg>
                      選択{folderTargets.length > 1 ? `（${folderTargets.length}フォルダ）` : ''}
                    </button>
                    <button
                      onClick={() => {
                        updateFolderLoadSetting(path, prev => ({
                          ...prev,
                          includeAll: !prev.includeAll,
                          limit: prev.limit || DEFAULT_FOLDER_LOAD_LIMIT,
                        }), meta);
                        setFolderCtxMenu(m => ({ ...m, visible: false }));
                      }}
                      onMouseEnter={e => e.currentTarget.style.background = '#f5f3ff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                      style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#7C4DFF', textAlign: 'left', fontWeight: 600 }}
                    >
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M4 12h16" /><path d={setting.includeAll ? 'M8 8l8 8M16 8l-8 8' : 'M12 4v16'} /></svg>
                      {setting.includeAll ? '全期間読み込みをOFF' : '全期間読み込みをON'}
                    </button>
                    {setting.includeAll && (
                      <div style={{ padding: '7px 14px 9px' }}>
                        <div style={{ marginBottom: '6px', fontSize: '11px', fontWeight: 700, color: '#64748b' }}>読み込む記事数</div>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px' }}>
                          {FOLDER_LOAD_LIMIT_OPTIONS.map(limit => (
                            <button
                              key={limit}
                              onClick={() => {
                                updateFolderLoadSetting(path, prev => ({ ...prev, includeAll: true, limit }), meta);
                                setFolderCtxMenu(m => ({ ...m, visible: false }));
                              }}
                              style={{ minWidth: '34px', padding: '5px 7px', borderRadius: '6px', border: `1px solid ${setting.limit === limit ? '#7C4DFF' : '#e2e8f0'}`, background: setting.limit === limit ? '#f5f3ff' : 'white', color: setting.limit === limit ? '#7C4DFF' : '#64748b', cursor: 'pointer', fontSize: '11px', fontWeight: 700 }}
                            >{limit}</button>
                          ))}
                          <button
                            onClick={() => {
                              updateFolderLoadSetting(path, prev => ({ ...prev, includeAll: true, limit: nextLimit }), meta);
                              setFolderCtxMenu(m => ({ ...m, visible: false }));
                            }}
                            style={{ padding: '5px 7px', borderRadius: '6px', border: '1px solid #e2e8f0', background: 'white', color: '#64748b', cursor: 'pointer', fontSize: '11px', fontWeight: 700 }}
                          >+{FOLDER_LOAD_STEP}</button>
                        </div>
                      </div>
                    )}
                    <div style={{ height: '1px', background: '#e2e8f0', margin: '4px 0' }} />
                  </>
                );
              })()}
              <button
                onClick={() => { onHideFolder && onHideFolder(folderCtxMenu.path); setFolderCtxMenu(m => ({ ...m, visible: false })); }}
                onMouseEnter={e => e.currentTarget.style.background = '#fff7ed'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#ea580c', textAlign: 'left' }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" /></svg>
                サイドバーから非表示
              </button>
              <button
                onClick={() => {
                  onOpenAccessoryReport && onOpenAccessoryReport(folderCtxMenu.path);
                  setFolderCtxMenu(m => ({ ...m, visible: false }));
                }}
                onMouseEnter={e => e.currentTarget.style.background = '#ecfeff'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#0891b2', textAlign: 'left', fontWeight: 600 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M4 19V9M10 19V5M16 19v-7M22 19V2" /></svg>
                周辺機器の生成結果
              </button>
              <button
                onClick={() => {
                  setConfirmFolderDelete(getFolderContextTargets(folderCtxMenu.path));
                  setFolderCtxMenu(m => ({ ...m, visible: false }));
                }}
                onMouseEnter={e => e.currentTarget.style.background = '#fff1f2'} onMouseLeave={e => e.currentTarget.style.background = 'none'}
                style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '9px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: '13px', color: '#ef4444', textAlign: 'left', fontWeight: 600 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14H6L5 6" /><path d="M10 11v6M14 11v6" /><path d="M9 6V4h6v2" /></svg>
                削除{getFolderContextTargets(folderCtxMenu.path).length > 1 ? `（${getFolderContextTargets(folderCtxMenu.path).length}フォルダ）` : ''}
              </button>
            </div>
          )}

          {/* ── 削除確認ダイアログ ── */}
          {confirmDelete && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', zIndex: 10000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: 'white', borderRadius: '12px', padding: '24px', maxWidth: '360px', width: '90%', boxShadow: '0 20px 60px rgba(0,0,0,0.2)' }}>
                <div style={{ fontSize: '15px', fontWeight: 700, color: '#1e293b', marginBottom: '8px' }}>記事を削除しますか？</div>
                <div style={{ fontSize: '13px', color: '#64748b', marginBottom: '20px', lineHeight: '1.6' }}>
                  {confirmDeleteLabel}を削除します。<br />この操作は取り消せません。
                </div>
                <div style={{ display: 'flex', gap: '8px', justifyContent: 'flex-end' }}>
                  <button
                    onClick={() => setConfirmDelete(null)}
                    style={{ padding: '8px 16px', borderRadius: '8px', border: '1px solid #e2e8f0', background: 'white', color: '#64748b', cursor: 'pointer', fontSize: '13px', fontWeight: 600 }}
                  >キャンセル</button>
                  <button
                    onClick={() => { onDeleteArticle(confirmDeleteTargets); setConfirmDelete(null); }}
                    style={{ padding: '8px 16px', borderRadius: '8px', border: 'none', background: '#ef4444', color: 'white', cursor: 'pointer', fontSize: '13px', fontWeight: 600 }}
                  >削除する</button>
                </div>
              </div>
            </div>
          )}

          {/* ── フォルダ削除確認ダイアログ ── */}
          {confirmFolderDelete && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', zIndex: 10000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: 'white', borderRadius: '12px', padding: '24px', maxWidth: '420px', width: '90%', boxShadow: '0 20px 60px rgba(0,0,0,0.2)' }}>
                <div style={{ fontSize: '15px', fontWeight: 700, color: '#1e293b', marginBottom: '8px' }}>フォルダを削除しますか？</div>
                <div style={{ fontSize: '13px', color: '#64748b', marginBottom: '12px', lineHeight: '1.6' }}>
                  {confirmFolderDelete.length}件のフォルダと、その中の記事・子フォルダをOneDriveのごみ箱へ移動します。
                </div>
                <div style={{ maxHeight: '150px', overflowY: 'auto', border: '1px solid #e2e8f0', borderRadius: '8px', background: '#f8fafc', padding: '8px 10px', marginBottom: '18px' }}>
                  {confirmFolderDelete.map(path => <div key={path} style={{ fontSize: '11px', color: '#475569', padding: '3px 0', wordBreak: 'break-all' }}>{path}</div>)}
                </div>
                <div style={{ display: 'flex', gap: '8px', justifyContent: 'flex-end' }}>
                  <button
                    disabled={folderDeleteRunning}
                    onClick={() => setConfirmFolderDelete(null)}
                    style={{ padding: '8px 16px', borderRadius: '8px', border: '1px solid #e2e8f0', background: 'white', color: '#64748b', cursor: folderDeleteRunning ? 'not-allowed' : 'pointer', fontSize: '13px', fontWeight: 600 }}
                  >キャンセル</button>
                  <button
                    disabled={folderDeleteRunning}
                    onClick={async () => {
                      setFolderDeleteRunning(true);
                      try {
                        const result = await onDeleteFolders(confirmFolderDelete);
                        if ((result?.deletedPaths || []).length > 0) clearFolderSelection();
                        setConfirmFolderDelete(null);
                      } finally {
                        setFolderDeleteRunning(false);
                      }
                    }}
                    style={{ padding: '8px 16px', borderRadius: '8px', border: 'none', background: '#ef4444', color: 'white', cursor: folderDeleteRunning ? 'wait' : 'pointer', fontSize: '13px', fontWeight: 600, opacity: folderDeleteRunning ? 0.7 : 1 }}
                  >{folderDeleteRunning ? '削除中...' : 'ごみ箱へ移動'}</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    // === サイドバー コンポーネント ===
    function Sidebar({ articles, selectedId, onSelect, onNewArticle, loading, sidebarWidth, onResizeStart, isCollapsed, onToggle, mobileSidebarOpen, onMobileClose, onDeleteArticle, onDeleteFolders, onDuplicateArticle, onMoveArticle, onSchedulePost, onBulkReplace, onCreateAccessory, onCreateTitleVariant, onOpenAccessoryReport, selectMode, selectedIds, onToggleSelect, onEnterSelectMode, multiSelectedIds, onMultiSelect, onRangeSelect, scheduledPostIds = new Set(), scheduledPostMap = new Map(), missedNotePostMap = new Map(), setAffModalOpen, articleH1Cache, folderMeta = {}, folderLoading = {}, onLoadFolder, rootArticleLimit = ROOT_ARTICLE_DEFAULT_LIMIT, onChangeRootArticleLimit, externalFolderUrls = [], setExternalFolderUrls, onRefreshArticles }) {
      // 非表示フォルダ管理（localStorageで永続化）
      const [hiddenFolders, setHiddenFolders] = useState(() => {
        try {
          const saved = new Set(JSON.parse(localStorage.getItem('sb_hiddenFolders') || '[]'));
          if (localStorage.getItem(NOTE_UPLOADED_VISIBILITY_MIGRATION_KEY) !== '1') {
            [...saved].forEach(path => {
              if (isNoteUploadedFolderPath(path)) saved.delete(path);
            });
            localStorage.setItem('sb_hiddenFolders', JSON.stringify([...saved]));
            localStorage.setItem(NOTE_UPLOADED_VISIBILITY_MIGRATION_KEY, '1');
          }
          return saved;
        }
        catch { return new Set(); }
      });
      const [folderLoadSettings, setFolderLoadSettings] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(FOLDER_LOAD_SETTINGS_STORAGE_KEY) || '{}');
          return Object.fromEntries(Object.entries(saved || {}).map(([path, setting]) => [
            path,
            normalizeFolderLoadSetting(setting, defaultFolderLoadSetting(path).limit),
          ]));
        } catch {
          return {};
        }
      });
      const [showFolderPicker, setShowFolderPicker] = useState(false);
      const [showLinkPicker, setShowLinkPicker] = useState(false);
      const [sidebarSearchOpen, setSidebarSearchOpen] = useState(false);
      const [sidebarSearchText, setSidebarSearchText] = useState('');
      const sidebarSearchInputRef = useRef(null);
      // リンク集のドラッグ＆ドロップ（HTML5対応）用ステート
      const [customLinks, setCustomLinks] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('sb_customLinks'));
          if (saved && Array.isArray(saved) && saved.length > 0) return ensureInfoViewerLink(saved);
        } catch { }
        return ensureInfoViewerLink([
          { id: 'mobile-links', title: 'モバイルリンク集', url: '/links.html' },
          { id: 'note', title: 'note', url: 'https://note.com/startupm' },
          { id: 'yt-sheet', title: 'YouTube動画取得シート', url: 'https://docs.google.com/spreadsheets/d/1cw6RC1XX4nAYvfZrBq7nmTtrr2oGFsSI0r_pVIxGxAc/edit?pli=1&gid=983578135#gid=983578135' }
        ]);
      });

      // 全フォルダパス一覧（記事のpathから導出）
      const [linkDragState, setLinkDragState] = useState({ isDragging: false, startIndex: null, overIndex: null });
      const [linkTouchGhost, setLinkTouchGhost] = useState(null);
      const linkTouchRef = useRef({ timer: null, startX: 0, startY: 0, startIndex: null, overIndex: null, dragging: false, blockClickUntil: 0 });
      const LINK_LONG_PRESS_MS = 350;

      const persistCustomLinks = useCallback((updater) => {
        setCustomLinks(prevLinks => {
          const nextLinks = ensureInfoViewerLink(typeof updater === 'function' ? updater(prevLinks) : updater);
          try { localStorage.setItem('sb_customLinks', JSON.stringify(nextLinks)); } catch { }
          return nextLinks;
        });
      }, []);

      useEffect(() => {
        try { localStorage.setItem('sb_customLinks', JSON.stringify(ensureInfoViewerLink(customLinks))); } catch { }
      }, []);

      const reorderCustomLinks = useCallback((startIndex, targetIndex) => {
        if (!Number.isInteger(startIndex) || !Number.isInteger(targetIndex) || startIndex === targetIndex) return;
        persistCustomLinks((links) => {
          if (startIndex < 0 || targetIndex < 0 || startIndex >= links.length || targetIndex >= links.length) return links;
          const newLinks = [...links];
          const [moved] = newLinks.splice(startIndex, 1);
          newLinks.splice(targetIndex, 0, moved);
          return newLinks;
        });
      }, [persistCustomLinks]);

      const moveCustomLinkByStep = useCallback((index, delta) => {
        const targetIndex = index + delta;
        reorderCustomLinks(index, targetIndex);
      }, [reorderCustomLinks]);

      const clearLinkTouchTimer = useCallback(() => {
        if (linkTouchRef.current.timer) {
          clearTimeout(linkTouchRef.current.timer);
          linkTouchRef.current.timer = null;
        }
      }, []);

      const resetLinkTouchDrag = useCallback(() => {
        clearLinkTouchTimer();
        linkTouchRef.current.dragging = false;
        linkTouchRef.current.startIndex = null;
        linkTouchRef.current.overIndex = null;
        setLinkTouchGhost(null);
        setLinkDragState({ isDragging: false, startIndex: null, overIndex: null });
      }, [clearLinkTouchTimer]);

      const updateTouchLinkTarget = useCallback((clientX, clientY) => {
        const hit = document.elementFromPoint(clientX, clientY);
        const item = hit && hit.closest('[data-custom-link-index]');
        const nextIndex = item ? Number(item.dataset.customLinkIndex) : null;
        if (Number.isInteger(nextIndex) && nextIndex !== linkTouchRef.current.overIndex) {
          linkTouchRef.current.overIndex = nextIndex;
          setLinkDragState(prev => prev.isDragging ? { ...prev, overIndex: nextIndex } : prev);
        }
      }, []);

      const handleDragStartLink = (e, index) => {
        setLinkDragState({ isDragging: true, startIndex: index, overIndex: index });
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(index));
        if (navigator.vibrate) navigator.vibrate(40);
      };
      const handleDragOverLink = (e, index) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (linkDragState.overIndex !== index) {
          setLinkDragState(prev => ({ ...prev, overIndex: index }));
        }
      };
      const handleDropLink = (e, targetIndex) => {
        e.preventDefault();
        reorderCustomLinks(linkDragState.startIndex, targetIndex);
        setLinkDragState({ isDragging: false, startIndex: null, overIndex: null });
      };
      const handleDragEndLink = () => {
        setLinkDragState({ isDragging: false, startIndex: null, overIndex: null });
      };
      const handleTouchStartLink = (e, index, title) => {
        if (e.touches.length !== 1) return;
        const touch = e.touches[0];
        clearLinkTouchTimer();
        linkTouchRef.current.startX = touch.clientX;
        linkTouchRef.current.startY = touch.clientY;
        linkTouchRef.current.startIndex = index;
        linkTouchRef.current.overIndex = index;
        linkTouchRef.current.dragging = false;
        linkTouchRef.current.timer = setTimeout(() => {
          linkTouchRef.current.timer = null;
          linkTouchRef.current.dragging = true;
          linkTouchRef.current.blockClickUntil = Date.now() + 450;
          setLinkDragState({ isDragging: true, startIndex: index, overIndex: index });
          setLinkTouchGhost({ x: touch.clientX, y: touch.clientY, name: title });
          if (navigator.vibrate) navigator.vibrate(40);
        }, LINK_LONG_PRESS_MS);
      };
      const handleTouchMoveLink = (e) => {
        const touch = e.touches[0];
        if (!touch) return;
        if (linkTouchRef.current.dragging) {
          e.preventDefault();
          setLinkTouchGhost(prev => prev ? { ...prev, x: touch.clientX, y: touch.clientY } : null);
          updateTouchLinkTarget(touch.clientX, touch.clientY);
          return;
        }
        const dx = touch.clientX - linkTouchRef.current.startX;
        const dy = touch.clientY - linkTouchRef.current.startY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) clearLinkTouchTimer();
      };
      const handleTouchEndLink = (e, fallbackIndex) => {
        clearLinkTouchTimer();
        if (!linkTouchRef.current.dragging) return;
        e.preventDefault();
        const targetIndex = Number.isInteger(linkTouchRef.current.overIndex) ? linkTouchRef.current.overIndex : fallbackIndex;
        reorderCustomLinks(linkTouchRef.current.startIndex, targetIndex);
        resetLinkTouchDrag();
      };
      const handleTouchCancelLink = () => {
        resetLinkTouchDrag();
      };
      const blockLinkClickIfNeeded = (e) => {
        if (linkTouchRef.current.dragging || Date.now() < linkTouchRef.current.blockClickUntil) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
        return false;
      };

      const allFolderPaths = useMemo(() => {
        const paths = new Set();
        Object.keys(folderMeta || {}).forEach(path => {
          if (path) paths.add(path);
        });
        for (const a of articles) {
          const parts = (a.path || '').trim().split('/').filter(Boolean);
          let acc = '';
          for (const part of parts) {
            acc = acc ? `${acc}/${part}` : part;
            paths.add(acc);
          }
        }
        return [...paths].sort((a, b) => a.localeCompare(b));
      }, [articles, folderMeta]);

      const sidebarSearchQuery = sidebarSearchText.trim();
      const normalizedSidebarSearchQuery = normalizeArticleSearchText(sidebarSearchQuery);
      const sidebarSearchResults = useMemo(() => {
        if (!normalizedSidebarSearchQuery) return [];
        return (articles || [])
          .filter((article) => {
            const title = getArticleDisplayTitle(article, articleH1Cache);
            return normalizeArticleSearchText(title).includes(normalizedSidebarSearchQuery);
          })
          .sort((a, b) => {
            const aTitle = getArticleDisplayTitle(a, articleH1Cache);
            const bTitle = getArticleDisplayTitle(b, articleH1Cache);
            return normalizeArticleSearchText(aTitle).indexOf(normalizedSidebarSearchQuery)
              - normalizeArticleSearchText(bTitle).indexOf(normalizedSidebarSearchQuery);
          });
      }, [articles, articleH1Cache, normalizedSidebarSearchQuery]);
      const emptySearchHiddenFolders = useMemo(() => new Set(), []);
      const emptySearchFolderMeta = useMemo(() => ({}), []);

      const openSidebarSearch = useCallback(() => {
        setSidebarSearchOpen(true);
        setTimeout(() => sidebarSearchInputRef.current?.focus(), 50);
      }, []);

      const closeSidebarSearch = useCallback(() => {
        setSidebarSearchOpen(false);
        setSidebarSearchText('');
      }, []);

      const toggleFolderVisibility = useCallback((folderPath) => {
        setHiddenFolders(prev => {
          const next = new Set(prev);
          next.has(folderPath) ? next.delete(folderPath) : next.add(folderPath);
          try { localStorage.setItem('sb_hiddenFolders', JSON.stringify([...next])); } catch { }
          return next;
        });
      }, []);

      const changeFolderLoadSetting = useCallback((folderPath, updater) => {
        const fallback = defaultFolderLoadSetting(folderPath).limit;
        const current = normalizeFolderLoadSetting(folderLoadSettings[folderPath] || defaultFolderLoadSetting(folderPath), fallback);
        const resolved = normalizeFolderLoadSetting(typeof updater === 'function' ? updater(current) : updater, fallback);
        setFolderLoadSettings(prev => {
          const next = { ...prev, [folderPath]: resolved };
          try { localStorage.setItem(FOLDER_LOAD_SETTINGS_STORAGE_KEY, JSON.stringify(next)); } catch { }
          return next;
        });
        return resolved;
      }, [folderLoadSettings]);

      // フォルダピッカー・リンクピッカー外クリックで閉じる
      const pickerRef = useRef(null);
      const linkPickerRef = useRef(null);
      useEffect(() => {
        const close = (e) => {
          if (showFolderPicker && pickerRef.current && !pickerRef.current.contains(e.target)) setShowFolderPicker(false);
          if (showLinkPicker && linkPickerRef.current && !linkPickerRef.current.contains(e.target)) setShowLinkPicker(false);
        };
        window.addEventListener('pointerdown', close);
        return () => window.removeEventListener('pointerdown', close);
      }, [showFolderPicker, showLinkPicker]);

      const folderTreeProps = {
        articles, selectedId, loading,
        onDeleteArticle, onDeleteFolders, onDuplicateArticle, onMoveArticle, onSchedulePost, onBulkReplace, onCreateAccessory, onCreateTitleVariant, onOpenAccessoryReport,
        hiddenFolders, onHideFolder: toggleFolderVisibility,
        selectMode, selectedIds, onToggleSelect, onEnterSelectMode,
        multiSelectedIds, onMultiSelect, onRangeSelect,
        scheduledPostIds,
        scheduledPostMap,
        missedNotePostMap,
        articleH1Cache,
        folderMeta, folderLoading, onLoadFolder,
        folderLoadSettings,
        onChangeFolderLoadSetting: changeFolderLoadSetting,
        rootArticleLimit,
        onChangeRootArticleLimit,
      };

      const renderSearchPanel = () => sidebarSearchOpen ? (
        <div className="border-b border-slate-100 bg-white px-2 py-2">
          <div className="flex items-center gap-1 rounded-lg border border-slate-200 bg-slate-50 px-2 py-1.5 shadow-sm">
            <svg className="flex-shrink-0 text-slate-400" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
              <circle cx="11" cy="11" r="8" /><path d="M21 21l-4.35-4.35" />
            </svg>
            <input
              ref={sidebarSearchInputRef}
              type="text"
              value={sidebarSearchText}
              onChange={(e) => setSidebarSearchText(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Escape') closeSidebarSearch();
              }}
              placeholder="記事タイトルを検索"
              className="min-w-0 flex-1 bg-transparent text-xs text-slate-700 outline-none placeholder:text-slate-400"
              id="sidebar-search-input"
            />
            <button
              type="button"
              onClick={closeSidebarSearch}
              className="rounded p-0.5 text-slate-400 hover:bg-slate-200 hover:text-slate-600"
              title="検索を閉じる"
            >
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12" /></svg>
            </button>
          </div>
        </div>
      ) : null;

      const renderSearchResults = (selectArticle) => {
        if (!sidebarSearchQuery) {
          return (
            <div className="px-4 py-8 text-center text-xs text-slate-400">
              検索ワードを入力してください
            </div>
          );
        }
        if (sidebarSearchResults.length === 0) {
          return (
            <div className="px-4 py-8 text-center text-xs text-slate-400">
              一致する記事がありません
            </div>
          );
        }
        return (
          <FolderTree

      const [sections, setSections] = useState([{ id: 'MEMO1', label: 'メモ1', content: '' }]);
      const [act, setAct] = useState('MEMO1');
      const [ld, setLd] = useState(false);

      const [cp, setCp] = useState(false);
      const [storageUrl, setStorageUrl] = useState('');
      const [sourceVersion, setSourceVersion] = useState(null);
      const [tabMenu, setTabMenu] = useState({ visible: false, x: 0, y: 0, sectionId: '' });
      // モーダルサイズ（リサイズ対応）
      const [modalW, setModalW] = useState(680);
      const [modalH, setModalH] = useState(600);
      const resizing = useRef(false);
      const resizeStart = useRef({ x: 0, y: 0, w: 0, h: 0 });
      // アフィリエイト自動保存（ユーザー編集時のみ）
      const affAutoSaveTimer = useRef(null);
      const affUserEdited = useRef(false); // ユーザーが実際に編集したかを追跡

      const doLoad = useCallback(() => {
        setLd(true);
        affUserEdited.current = false; // ロード中はユーザー編集フラグをリセット
        fetchAffiliateSections()
          .then(({ sections: nextSections, storageUrl: nextStorageUrl, sourceVersion: nextSourceVersion }) => {
            setSections(nextSections);
            setStorageUrl(nextStorageUrl);
            setSourceVersion(nextSourceVersion);
            const ids = nextSections.map(section => section.id);

    // ── OGP ヘルパー（Appコンポーネント外・純粋関数） ──────────────
    function _esc(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }
    function buildOgpCard(href, title, description, image, domain) {
      const card = document.createElement('a');
      card.href = href; card.target = '_blank'; card.rel = 'noopener noreferrer';
      card.className = 'ogp-card';
      card.innerHTML = [
        `<div class="ogp-card-body">`,
        domain ? `<div class="ogp-card-domain">${_esc(domain)}</div>` : '',
        title ? `<div class="ogp-card-title">${_esc(title)}</div>` : '',
        description ? `<div class="ogp-card-desc">${_esc(description)}</div>` : '',
        `</div>`,
        image ? `<img class="ogp-card-image" src="${_esc(image)}" alt="" loading="lazy" onerror="this.style.display='none'" />` : '',
      ].join('');
      return card;
    }
    function insertOgpCard(a, card) {
      if (!a || !a.isConnected) return;
      const p = a.parentElement;
      if (!p || p.tagName !== 'P') { a.replaceWith(card); return; }
      const pText = (p.textContent || '').trim();
      const aText = (a.textContent || '').trim();
      if (pText === aText) {
        if (p.dataset.line) card.dataset.line = p.dataset.line;
        p.replaceWith(card);
      } else {
        const prev = a.previousSibling;
        if (prev && prev.nodeName === 'BR') prev.remove();
        a.remove();
        if ((p.textContent || '').trim() === '') {
          if (p.dataset.line) card.dataset.line = p.dataset.line;
          p.replaceWith(card);
        }
        else p.after(card);
      }
    }
    function isOgpUrl(a) {
      const href = a.getAttribute('href') || '';
      if (!href.startsWith('http')) return false;
      const text = (a.textContent || '').trim();
      return text === href || text === href.replace(/^https?:\/\//, '');
    }

    function mergeArticlesById(current, incoming) {
      const map = new Map((current || []).map(article => [article.id, article]));
      (incoming || []).forEach(article => map.set(article.id, { ...(map.get(article.id) || {}), ...article }));
      return [...map.values()].sort((a, b) => new Date(b.lastModified) - new Date(a.lastModified));
    }

    function foldersToMeta(folders, previous = {}) {
      const next = { ...previous };
      (folders || []).forEach(folder => {
        if (!folder || !folder.path) return;
        next[folder.path] = { ...(next[folder.path] || {}), ...folder };
      });
      return next;
    }

          }
          if (editorDragging.current && editorAreaRef.current) {
            const rect = editorAreaRef.current.getBoundingClientRect();
            const ratio = (e.clientX - rect.left) / rect.width;
            setEditorRatio(Math.min(0.85, Math.max(0.15, ratio)));

            saving: 92,

            completed: 100,

        const seconds = Math.max(0, Math.floor((ended - started) / 1000));
