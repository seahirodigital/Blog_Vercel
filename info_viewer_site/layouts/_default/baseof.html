<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="YouTubeの文字起こしを軽量に読むモバイル専用ビューアー">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/viewer.css" | relURL }}">
  </head>
  <body
    data-page-kind="{{ if .IsHome }}list{{ else }}article{{ end }}"
    data-article-id="{{ if not .IsHome }}{{ .File.BaseFileName }}{{ end }}"
    data-trigger-endpoint="{{ .Site.Params.triggerEndpoint }}">
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
    <script id="viewer-data" type="application/json">{{ $index := hugo.Data.article_index }}{{ $articles := slice }}{{ with $index }}{{ with .articleList }}{{ $articles = . }}{{ end }}{{ end }}{{ $articles | jsonify | safeJS }}</script>
    <script src="{{ "js/viewer.js" | relURL }}" defer></script>
  </body>
</html>
