{{- $isMoomooStock := hasPrefix .Destination "https://www.moomoo.com/ja/stock/" -}}
{{- $destination := .Destination | safeURL -}}
{{- $href := $destination -}}
{{- if $isMoomooStock -}}
  {{- $href = printf "ftmm://url/%s" (urlquery .Destination) | safeURL -}}
{{- end -}}
<a href="{{ $href }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $isMoomooStock }} class="moomoo-stock-link" data-moomoo-stock-link="true" data-moomoo-web-url="{{ $destination }}" aria-label="Moomooアプリで{{ .Text }}を開く"{{ end }}>{{ .Text | safeHTML }}</a>
